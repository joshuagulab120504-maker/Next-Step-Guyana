<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1f2d">
<title>Next Step Guyana</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Sora:wght@500..800&family=Inter:wght@400..900&display=swap');
:root{
  --slate:#3b4753;--slate-2:#2c3742;
  --ink:#16232f;--body:#435262;--muted:#64758a;--faint:#94a2ae;
  --paper:#f5f7f9;--surface:#fff;--line:#e4e9ee;--line-2:#eef1f4;
  --green:#2f7d4f;--green-2:#256a42;--green-bg:#eef6f1;--green-line:#cbe3d5;
  --gold:#c9922c;--gold-2:#e0ad3c;--gold-bg:#fdf6e6;--gold-line:#eddfb6;
  --purple:#6c5cb8;--purple-bg:#efecfa;--purple-line:#d9d0f2;
  --amber:#c1701c;--amber-bg:#fdf6ea;--amber-line:#f0e0c3;
  --red:#b4463f;--red-bg:#fbeeed;
  --r:12px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-accent:'Sora',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fa:'Sora',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:92px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
p{margin:0}
h1,h2,h3,h4{font-family:var(--font-display);font-optical-sizing:auto;font-variation-settings:'SOFT' 0,'WONK' 0;font-weight:600;margin:0;letter-spacing:-.012em;line-height:1.18}
h1{font-size:clamp(30px,5vw,42px);letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}
.wrap{width:min(700px,calc(100% - 40px));margin:0 auto}

/* ---------- masthead ---------- */
.mast{background:var(--slate);position:sticky;top:0;z-index:60}
.mast-in{width:min(1120px,calc(100% - 40px));margin:0 auto;height:64px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo i{width:34px;height:34px;border-radius:8px;background:#faf9f4;color:#1e3b2b;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.logo b{color:#fff;font-size:16px;font-weight:700;letter-spacing:.03em}
.mnav{display:none;margin-left:26px;gap:2px}
.mnav button{color:#fff;opacity:.74;font-size:14.5px;font-weight:600;padding:9px 13px;border-radius:8px}
.mnav button:hover{opacity:1;background:rgba(255,255,255,.09)}
.mnav button.on{opacity:1;background:rgba(255,255,255,.13)}
.acct{margin-left:auto;display:flex;align-items:center;gap:11px}
.acct span{display:none;color:#8ed4a8;font-size:11px;font-weight:700;letter-spacing:.1em;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:8px 12px}
.acct i{width:32px;height:32px;border-radius:50%;background:#1f4a37;color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}

/* ---------- timeline band ---------- */
.band{background:var(--slate-2);position:relative;overflow:hidden}
.band:before{content:"";position:absolute;inset:0;opacity:.4;background-image:
 radial-gradient(1.4px 1.4px at 11% 26%,#fff,transparent),radial-gradient(1px 1px at 27% 66%,#fff,transparent),
 radial-gradient(1.4px 1.4px at 43% 18%,#fff,transparent),radial-gradient(1px 1px at 58% 74%,#fff,transparent),
 radial-gradient(1.4px 1.4px at 70% 32%,#fff,transparent),radial-gradient(1px 1px at 82% 62%,#fff,transparent),
 radial-gradient(1.4px 1.4px at 92% 22%,#fff,transparent),radial-gradient(1px 1px at 6% 76%,#fff,transparent)}
.band-in{position:relative;width:min(1120px,calc(100% - 40px));margin:0 auto;padding:17px 0 14px}
.band-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.band-head b{color:#fff;font-size:14.5px;font-weight:600}
.band-head b em{font-style:normal;color:var(--gold-2);font-weight:500}
.band-head span{color:#93a3af;font-size:11.5px;font-weight:600;letter-spacing:.09em}
.tlv{position:relative}
.tlv:before,.tlv:after{content:"";position:absolute;top:0;bottom:0;width:40px;pointer-events:none;z-index:3;opacity:0;transition:opacity .2s}
.tlv:before{left:0;background:linear-gradient(90deg,var(--slate-2),transparent)}
.tlv:after{right:0;background:linear-gradient(270deg,var(--slate-2),transparent)}
.tlv.fl:before,.tlv.fr:after{opacity:1}
.tls{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding:20px 0 3px;-webkit-overflow-scrolling:touch}
.tls::-webkit-scrollbar{height:0}
.nd{position:relative;flex:0 0 110px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 4px}
.nd:before{content:"";position:absolute;top:12px;left:-50%;width:100%;height:1.5px;background:rgba(255,255,255,.17);z-index:0}
.nd:first-child:before{display:none}
.nd.done:before,.nd.now:before{background:rgba(224,173,60,.6)}
.nd .p{position:relative;z-index:1;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--slate-2);
 border:1.5px dashed rgba(255,255,255,.34);color:#9fb0bb;font-size:11.5px;font-weight:700;transition:.18s}
.nd.done .p{background:var(--gold-2);border:1.5px solid var(--gold-2);color:#241a04}
.nd.now .p{width:29px;height:29px;margin-top:-2px;background:var(--gold-2);border:1.5px solid var(--gold-2);color:#241a04;box-shadow:0 0 0 4px rgba(224,173,60,.2)}
.nd.fork .p{border-style:solid;border-color:rgba(224,173,60,.7)}
.nd.now.fork .p{color:#241a04}
.nd .l{display:block;font-size:12.5px;color:#c8d5dd;margin-top:9px;font-weight:500}
.nd.done .l,.nd.now .l{color:#fff}
.nd.now .l{font-weight:700}
.nd .s{display:block;font-size:10px;color:#8798a4;margin-top:3px;letter-spacing:.05em;font-weight:600}
.nd.now .s{color:var(--gold-2)}
.nd.fork .s{color:var(--gold-2)}
.nd.sel .l{text-decoration:underline;text-underline-offset:3px}
.rail{height:2px;background:rgba(255,255,255,.11);margin-top:7px;border-radius:2px;overflow:hidden;display:none}
.rail i{display:block;height:100%;background:rgba(255,255,255,.34)}
.tlv.can+.rail{display:block}

/* ---------- page ---------- */
.page{padding:38px 0 0}
.kicker{display:block;font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--green);margin-bottom:11px}
.lede{color:var(--body);font-size:17px;margin-top:13px;max-width:54ch}
.cols{display:block}

/* section label — the signature green small-cap */
.sl{display:flex;align-items:baseline;justify-content:space-between;gap:14px;font-size:11.5px;font-weight:700;
 letter-spacing:.13em;text-transform:uppercase;color:var(--green);margin:38px 0 13px}
.sl em{font-style:normal;letter-spacing:.02em;text-transform:none;font-size:12.5px;font-weight:600;color:var(--muted)}
.a{font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:none;color:var(--green)}
.a:hover{text-decoration:underline}
.hint{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.55}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;
 border-radius:9px;padding:12px 19px;min-height:46px;font-size:14.5px;font-weight:700}
.btn:hover{background:var(--green-2)}
.btn.sec{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.sec:hover{background:#fafbfc;border-color:#d7dee4}
.btn.sm{padding:9px 14px;min-height:40px;font-size:13px}
.btn.w{width:100%}

/* notices */
.nb{border-left:3px solid var(--green-line);background:var(--surface);border-radius:0 var(--r) var(--r) 0;
 padding:16px 20px;font-size:15.5px;color:var(--body);line-height:1.6}
.nb strong{color:var(--ink)}
.nb.ok{border-left-color:var(--green);background:var(--green-bg);color:var(--green-2)}
.nb.note{border-left-color:var(--purple-line)}
.nb.dec{background:var(--amber-bg);border:1px solid var(--amber-line);border-left:3px solid var(--amber);border-radius:var(--r);padding:19px 21px}
.nb.dec .k{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:7px}
.nb.dec h3{font-size:18px;margin-bottom:6px}

/* subjects */
.subj{display:flex;flex-wrap:wrap;gap:8px}
.subj span{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 12px;font-size:14px;color:var(--ink)}
.subj span.new{border-color:var(--gold-line);background:var(--gold-bg);color:#7a5c12}
.subj button{border:1px dashed var(--line-2);border-color:#cfd7de;border-radius:7px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--green);min-height:38px}
.subj button:hover{background:var(--green-bg);border-color:var(--green-line)}
.grp{display:block;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:18px 0 9px}
.grp:first-child{margin-top:0}

/* four-slot checklist */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slot{background:var(--surface);padding:16px 18px;text-align:left}
.slot b{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.slot span{display:block;font-size:15px;color:var(--muted);margin-top:7px}
.slot em{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--green);margin-top:9px}
.slot.on{background:var(--green-bg)}
.slot.on b{color:var(--green)}
.slot.on span{color:var(--ink);font-weight:600}
.slot.auto em{color:var(--faint)}
.slot:not(.on):hover{background:#fafbfc}

/* task rows */
.task{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);
 border:1px solid var(--line);border-radius:var(--r);padding:16px 19px;margin-bottom:9px}
.task:hover{background:#fafbfc}
.task .bx{flex:0 0 21px;width:21px;height:21px;border-radius:50%;border:1.5px solid #ccd5dc;margin-top:2px;display:grid;place-items:center;font-size:11px;color:transparent}
.task b{display:block;font-size:15.5px;font-weight:600}
.task small{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.task[data-d="1"]{background:var(--green-bg);border-color:var(--green-line)}
.task[data-d="1"] .bx{background:var(--green);border-color:var(--green);color:#fff}
.task[data-d="1"] b{color:var(--green-2);text-decoration:line-through}

/* opportunity cards — the Form 1 focus */
.opp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 21px;margin-bottom:12px}
.opp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.opp h3{font-size:18.5px}
.opp p{color:var(--body);font-size:14.5px;margin-top:8px}
.meta{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line-2)}
.meta div b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.meta div span{display:block;font-size:14px;color:var(--ink);margin-top:3px}
.opp-act{margin-top:16px}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;border-radius:5px;padding:5px 9px;white-space:nowrap}
.tag.fit{background:var(--green-bg);color:var(--green)}
.tag.age{background:var(--purple-bg);color:var(--purple)}
.tag.soon{background:var(--gold-bg);color:#7a5c12}
.tag.later{background:#f1f4f6;color:var(--muted)}

/* interests */
.int{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:500}
.pill.on{background:var(--purple-bg);border-color:var(--purple-line);color:var(--purple);font-weight:600}
.pill.add{border-style:dashed;color:var(--green);font-weight:600;min-height:38px}

/* clusters */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cl{background:var(--surface);border:1px dashed #cfd7de;border-radius:var(--r);padding:16px 18px;text-align:left}
.cl h4{font-size:15.5px}
.cl p{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.cl em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--faint);margin-top:11px}
.cl.seen{border-style:solid;border-color:var(--purple-line);background:var(--purple-bg)}
.cl.seen em{color:var(--purple)}
.cl:hover{border-color:var(--purple-line)}

/* dark stat panel */
.stat{background:var(--slate-2);border-radius:var(--r);padding:22px;color:#fff}
.stat .k{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2)}
.stat h2{color:#fff;font-size:22px;margin:9px 0 6px}
.stat p{color:#c2d0d9;font-size:14.5px}
.stat cite{font-style:normal;color:#8fa1ad;font-size:12px}
.figs{display:flex;gap:10px;margin-top:17px}
.figs div{flex:1;background:rgba(255,255,255,.09);border-radius:9px;padding:13px}
.figs b{display:block;font-family:var(--font-display);font-size:23px;color:var(--gold-2)}
.figs span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#a9bcc7;margin-top:5px}

/* streams */
.st{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px 20px;margin-bottom:10px}
.st b{display:block;font-size:16.5px;font-weight:600;font-family:var(--font-display)}
.st small{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.st .kk{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.kk span{font-size:12.5px;padding:5px 9px;border-radius:5px}
.kk .y{background:var(--green-bg);color:var(--green)}
.kk .n{background:var(--red-bg);color:var(--red)}
.st.rec{border-color:var(--green-line);background:#fbfdfc}
.st:hover{border-color:#d3dae0}

/* kept pathways */
.krail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 20px 8px;margin:0 -20px;scrollbar-width:none}
.krail::-webkit-scrollbar{display:none}
.keep{flex:0 0 250px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.keep .c{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);background:var(--purple-bg);border-radius:5px;padding:4px 8px}
.keep h4{font-size:16.5px;margin-top:10px}
.ch{list-style:none;margin:11px 0 0;padding:0 0 0 15px;border-left:1.5px solid var(--line)}
.ch li{position:relative;font-size:12.5px;color:var(--muted);padding:4px 0}
.ch li:before{content:"";position:absolute;left:-20px;top:11px;width:6px;height:6px;border-radius:50%;background:#c9d4dc}
.ch li.h{color:var(--ink);font-weight:600}
.ch li.h:before{background:var(--gold-2)}
.kf{margin-top:13px;padding-top:11px;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;gap:10px}

/* mentors */
.mg{display:grid;gap:12px}
.mt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:19px 20px}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mh i{width:38px;height:38px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
.mt h4{font-size:16px}
.mt .w{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--purple)}
.mt p{color:var(--body);font-size:14.5px}
.mt cite{display:block;font-style:normal;margin-top:13px;padding-top:11px;border-top:1px solid var(--line-2);font-size:13px;color:var(--muted)}

/* record rows */
.rec{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.rec:last-child{border-bottom:0;padding-bottom:0}
.rec:first-child{padding-top:0}
.rec b{display:block;font-size:15px;font-weight:600}
.rec small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.rec .t{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}

/* route options */
.ro{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
 border:1px solid var(--line);border-radius:var(--r);padding:17px 20px;margin-bottom:9px}
.ro:hover{border-color:var(--green-line);background:#fbfdfc}
.ro b{display:block;font-size:16px;font-weight:600;font-family:var(--font-display)}
.ro small{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.rp{margin-top:6px}

/* profile identity */
.idc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.idc-top{height:76px;background:var(--slate-2);position:relative;overflow:hidden}
.idc-top:before{content:"";position:absolute;inset:0;opacity:.4;background-image:
 radial-gradient(1.3px 1.3px at 18% 40%,#fff,transparent),radial-gradient(1px 1px at 44% 66%,#fff,transparent),
 radial-gradient(1.3px 1.3px at 68% 32%,#fff,transparent),radial-gradient(1px 1px at 86% 60%,#fff,transparent)}
.idc-body{padding:0 22px 22px;position:relative}
.mono{width:74px;height:74px;border-radius:50%;background:var(--surface);border:4px solid var(--surface);
 box-shadow:0 1px 4px rgba(22,35,47,.14);color:var(--slate);display:grid;place-items:center;
 font-family:var(--font-display);font-size:26px;font-weight:600;margin-top:-37px}
.idc h2{font-size:25px;margin-top:15px}
.idc .whr{font-size:14.5px;color:var(--muted);margin-top:5px}
.idc .expl{font-size:15px;color:var(--body);margin-top:11px}
.idc-act{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.priv{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-top:16px;padding-top:15px;border-top:1px solid var(--line-2)}
.priv i{font-style:normal;color:var(--green);font-size:9px}

/* record ladder */
.ladder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:21px}
.lsteps{display:flex;gap:6px;margin:16px 0 0}
.lsteps div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.lsteps div.pass,.lsteps div.on{background:var(--green)}

/* dock, navi, toast, preview */
.dock{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
 border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 0 max(7px,env(safe-area-inset-bottom));z-index:55}
.dock button{padding:6px 2px;min-height:52px;font-size:11px;font-weight:600;color:var(--muted)}
.dock button.on{color:var(--green)}
.navi{position:fixed;right:18px;bottom:76px;height:46px;border-radius:23px;background:var(--gold-2);color:#241a04;
 padding:0 18px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:9px;box-shadow:0 4px 16px rgba(22,35,47,.2);z-index:58}
.navi i{font-style:normal;width:7px;height:7px;border-radius:50%;background:#241a04;opacity:.5}
.toast{position:fixed;left:50%;transform:translate(-50%,12px);bottom:92px;background:var(--ink);color:#fff;
 border-radius:9px;padding:13px 19px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:70;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.prev{position:fixed;left:16px;bottom:76px;z-index:57;background:rgba(44,55,66,.95);backdrop-filter:blur(8px);
 border-radius:9px;padding:6px;display:flex;gap:3px;flex-wrap:wrap;max-width:calc(100% - 160px)}
.prev button{color:#b7c6d0;font-size:11.5px;font-weight:600;padding:7px 10px;border-radius:6px;min-height:32px}
.prev button.on{background:var(--gold-2);color:#241a04;font-weight:700}

@media(min-width:880px){
  .wrap{width:min(760px,calc(100% - 56px))}
  .mnav{display:flex}
  .dock{display:none}

/* ---------- timeline band ---------- */
function band(){

    return '<button class="nd '+st+(s.f?' fork':'')+(n===sel?' sel':'')+'" data-n="'+n+'" role="tab" aria-selected="'+(n===sel)+'">'
     +'<span class="p">'+(n<stage?'✓':n)+'</span><span class="l">'+esc(s.l)+'</span>'
     +'<span class="s">'+(n===stage?'You are here':(s.s||''))+'</span></button>'}).join('');
  $$('#tls [data-n]').forEach(function(b){b.addEventListener('click',function(){sel=+b.dataset.n;picking=false;render()})});
  requestAnimationFrame(function(){
    var sc=$('#tls'),c=$('#tls .nd.now');

  if(can){var ra=sc.clientWidth/sc.scrollWidth,mx=sc.scrollWidth-sc.clientWidth;
    r.style.width=(ra*100)+'%';r.style.transform='translateX('+((sc.scrollLeft/mx)*(sc.clientWidth*(1-ra)))+'px)'}
}

     +'<div class="rec"><span><b>Clusters explored</b></span><span class="t">Archived</span></div>'
     +'<div class="rec"><span><b>Activities logged</b></span><span class="t">Archived</span></div></div>';
    return h+mentors(sel);
  }
  if(!now){
    var d={3:['Your stream choice','Science, Technical, Business or Arts. It decides which CSEC subjects you can sit.'],
           6:['Four routes after CSEC','Sixth Form, a technical institute, work plus study, or straight to UG.']}[sel];
    h+=d?'<div class="nb dec"><span class="k">The decision here</span><h3>'+d[0]+'</h3><p>'+d[1]+'</p></div>'
        :'<div class="nb">No decision at this stage.</div>';
    h+='<div style="margin-top:12px"><p class="hint">Nothing to do here yet. Your goals for this stage appear when you reach it.</p></div>';
    return h+mentors(sel);
  }
  return ({1:body1,2:body2,3:body3,4:body4,5:body5,6:body6}[sel]||bodyRoute)();
}

/* ---------- views ---------- */
function timelineView(){
  var hd={1:['Form 1 · '+STUDENT.school,'Welcome to secondary school.','Five years from here. This one is for settling in.'],
   2:['Form 2 · '+STUDENT.school,'You have got time.','Notice what pulls you. The stream choice is next year.'],
   3:['Form 3 · '+STUDENT.school,'This one matters.','Your stream decides which careers stay reachable.'],
   4:['Form 4 · '+STUDENT.school,'Form 4.','Your subject list is being settled. Here is what it affects.'],
   5:['Form 5 · '+STUDENT.school,'Exam year.','Registration, plan A and plan B.'],
   6:['After CSEC · '+STUDENT.school,'Now the fork.','Four routes. Only one needs Sixth Form.']}[stage]
   ||[S[stage-1].l,S[stage-1].l+'.','Your route, from here.'];
  var vis = sel===stage;
  return '<span class="kicker">'+esc(vis?hd[0]:S[sel-1].l+' · '+(sel<stage?'your record':'a look ahead'))+'</span>'
   +'<h1>'+esc(vis?hd[1]:S[sel-1].l)+'</h1>'
   +(vis?'<p class="lede">'+esc(hd[2])+'</p>':'')
   +'<section style="margin-top:20px">'+stageBody()+'</section>';
}
function careersView(){
  var d=lv(),k=KEPT.slice(0,d.kn);
  var h='<span class="kicker">Careers</span><h1>What you are exploring</h1><p class="lede">Keeping something means interested, not decided.</p>';
  h+='<div class="sl">Kept<em>'+k.length+'</em></div><div class="krail">'
   +k.map(function(x,i){return '<article class="keep"><span class="c">'+esc(x[0])+'</span><h4>'+esc(x[1])+'</h4>'
    +'<ul class="ch"><li class="h">'+esc(S[stage-1].l)+'</li>'+x[2].map(function(c){return '<li>'+esc(c)+'</li>'}).join('')
    +'<li>'+esc(x[3])+'</li></ul><div class="kf"><button class="a" data-uk="'+i+'">Un-keep</button>'
    +'<button class="a" data-n="3" data-goto="1">Branches</button></div></article>'}).join('')+'</div>';
  h+='<p class="hint">'+(10-k.length)+' pathways you passed on are still saved. Nothing is deleted.</p>';
  h+='<div class="sl">Career clusters<em>'+d.cl+' of 8 opened</em></div><div class="cg">'
   +CLU.map(function(c,i){var s=i<d.cl;return '<button class="cl'+(s?' seen':'')+'" data-a="clu"><h4>'+esc(c[0])+'</h4>'
    +'<p>'+esc(c[1])+'</p><em>'+(s?'Opened':'Not opened yet')+'</em></button>'}).join('')+'</div>';
  h+='<div style="margin-top:20px"><button class="btn w" data-a="deck">'+(stage<=2?'Look at more careers':'Review your pathways')+'</button></div>';
  return h;
}
function profileView(){
  var a=slotData(),f=a.filter(function(o){return o[2]}).length,d=lv();
  var acts=[['Cricket team','Sport','Form 1 – present',1],['Church youth group','Volunteering','Form 2 – present',2],
   ['District Mashramani — dramatic poetry','Arts','Form 2',2],['Science club','Club','Form 3 – present',3],
   ['School steel pan','Music','Form 5 – present',5]].filter(function(x){return x[3]<=stage});
  var awards=[['District Mashramani — third place','Form 2',2],['Debate team — school squad','Form 3',3],
   ['8 CSEC subjects sat','Form 5',5]].filter(function(x){return x[2]<=stage});
  var lad=['Started','Building','Strong','Application-ready'];
  var at=stage<=1?0:(stage<=3?1:(stage<=4?2:3));

  var h='<span class="kicker">Profile</span><h1>Your record</h1>'
   +'<p class="lede">Everything you have done, in one place. It builds as you move up.</p>';
  h+='<div class="cols" style="margin-top:20px"><div>';

  h+='<div class="idc"><div class="idc-top"></div><div class="idc-body"><div class="mono">'+STUDENT.mono+'</div>'
   +'<h2>'+esc(STUDENT.name)+'</h2>'
   +'<p class="whr">'+esc(S[stage-1].l)+' · '+esc(STUDENT.school)+' · '+esc(STUDENT.region)+'</p>'
   +'<p class="expl">Exploring '+(d.kn?KEPT.slice(0,Math.min(d.kn,2)).map(function(x){return x[1].toLowerCase()}).join(' and '):'a few directions')+'.</p>'
   +'<div class="idc-act"><button class="btn sm sec" data-a="edit">Edit</button>'
   +'<button class="btn sm" data-a="export">Export one-page summary</button></div>'
   +'<div class="priv"><i>●</i>Private. Nothing is shared unless you export it yourself.</div></div></div>';

  h+='<div class="sl">Subjects</div><div class="card">'
   +'<span class="grp">Forms 1–3</span><div class="subj">'+SUBJ[1].map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>';
  if(stage>=4) h+='<span class="grp">CSEC list</span><div class="subj">'+SUBJ[Math.min(stage,6)].map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>';
  h+='<button class="btn sm sec" style="margin-top:15px" data-a="sub">+ Add a subject</button></div>';

  h+=slots();

  h+='<div class="sl">Activities and experience<button class="a" data-a="addact">+ Add</button></div><div class="card">';
  if(!acts.length) h+='<p class="hint" style="margin:0">Nothing yet. Clubs, teams, volunteering, competitions and jobs all count.</p>';
  acts.forEach(function(x){h+='<div class="rec"><span><b>'+esc(x[0])+'</b><small>'+esc(x[2])+'</small></span><span class="t">'+esc(x[1])+'</span></div>'});
  h+='</div>';

  h+='<div class="sl">Awards and certificates<button class="a" data-a="addaw">+ Add</button></div><div class="card">';
  if(!awards.length) h+='<p class="hint" style="margin:0">Nothing yet. Competition placings, awards and certificates go here.</p>';
  awards.forEach(function(x){h+='<div class="rec"><span><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></span><span class="t">Award</span></div>'});
  h+='</div>';

  h+='</div><aside>';
  h+='<div class="sl" style="margin-top:0">Record strength</div><div class="ladder">'
   +'<h3 style="font-size:18px">'+lad[at]+'</h3>'
   +'<p class="hint" style="margin-top:6px">'+(at>=3?'This is what a scholarship or job application asks for.'
      :'A strong record is what a scholarship application asks for. Keep adding as you go.')+'</p>'
   +'<div class="lsteps">'+lad.map(function(l,i){return '<div class="'+(i===at?'on':(i<at?'pass':''))+'">'+l+'</div>'}).join('')+'</div>'
   +'<p class="hint"><strong>Next:</strong> '+(f<5?'fill your '+a.filter(function(o){return !o[2]})[0][0].toLowerCase()+' slot.':'keep your activities up to date.')+'</p></div>';
  h+='<div class="sl">Stage archive</div><div class="card">';
  if(stage===1) h+='<p class="hint" style="margin:0">Form 1 is still open. Finished stages are stored here.</p>';
  else for(var i=1;i<stage;i++) h+='<div class="rec"><span><b>'+esc(S[i-1].l)+'</b></span><span class="t">Archived</span></div>';
  h+='</div></aside></div>';
  return h;
}
function mentorsView(){
  var m=MEN[Math.min(stage,6)];
  var h='<span class="kicker">Mentors</span><h1>People who were where you are</h1>'
   +'<p class="lede">What they were doing at '+esc(S[stage-1].l)+'.</p>';
  h+='<div class="sl">Matched to your stage</div><div class="mg">'
   +m.map(function(x){return '<article class="mt"><div class="mh"><i>'+x[0]+'</i><div><span class="w">At '+esc(S[stage-1].l)+'</span>'
    +'<h4>'+esc(x[1])+'</h4></div></div><p>'+esc(x[2])+'</p><cite>'+esc(x[3])+'</cite>'
    +'<div style="margin-top:13px"><button class="btn sm sec" data-a="mentor">Their whole journey</button></div></article>'}).join('')+'</div>';
  h+='<div class="sl">Group sessions</div><div class="card"><h4 style="font-size:17px">'
   +(stage<=3?'What making things actually leads to':'Life after CSEC')+'</h4>'
   +'<p class="hint">Mentors who started where you are. Come with questions, or just listen.</p>'
   +'<div style="margin-top:14px"><button class="btn sm" data-a="pod">Join this session</button></div></div>';
  h+='<div class="sl">Recent from mentors</div><div class="card">'
   +'<div class="rec"><span>“Two things deep beats five half-heartedly.”<small>Aniyah</small></span></div>'
   +'<div class="rec"><span>“Nobody called it engineering. It still counted.”<small>Dave</small></span></div>'
   +'<div class="rec"><span>“Ask what a route actually leads to, not what it sounds like.”<small>Reginald</small></span></div></div>';
  return h;
}

/* ---------- render ---------- */
function render(){
  $('#acctName').textContent=STUDENT.name;$('#acctMono').textContent=STUDENT.mono;
  $('#page').innerHTML={timeline:timelineView,careers:careersView,profile:profileView,mentors:mentorsView}[tab]();
  $$('#mnav button,#dock button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
  $('#prev').innerHTML=BASE.map(function(s,i){return '<button data-st="'+(i+1)+'"'+(stage===i+1?' class="on"':'')+'>'+esc(s.l)+'</button>'}).join('');
  $$('#prev [data-st]').forEach(function(b){b.addEventListener('click',function(){
    S=BASE.slice();stage=+b.dataset.st;sel=stage;picking=false;render();window.scrollTo({top:0,behavior:'smooth'})})});
  band();wire();
}
function wire(){
  $$('#page [data-n]').forEach(function(b){b.addEventListener('click',function(){
    sel=+b.dataset.n;if(b.dataset.goto)tab='timeline';picking=false;render();window.scrollTo({top:0,behavior:'smooth'})})});
  $$('[data-go]').forEach(function(b){b.addEventListener('click',function(){tab=b.dataset.go;render();window.scrollTo({top:0,behavior:'smooth'})})});
  $$('.task').forEach(function(t){t.addEventListener('click',function(){
    var d=t.getAttribute('data-d')==='1';t.setAttribute('data-d',d?'0':'1');if(!d)toast('Added to your record')})});
  $$('[data-uk]').forEach(function(b){b.addEventListener('click',function(){
    KEPT.splice(+b.dataset.uk,1);LV[Math.min(stage,6)].kn=Math.max(0,LV[Math.min(stage,6)].kn-1);render();toast('Un-kept')})});
  $$('[data-a="up"]').forEach(function(b){b.addEventListener('click',function(){
    if(stage===6&&S.length===6){picking=true;sel=6;render();return}
    if(stage>=S.length){toast('This is the last stage on your timeline');return}
    stage++;sel=stage;render();toast(S[stage-1].l+' opened. Last stage archived.')})});
  $$('[data-r]').forEach(function(b){b.addEventListener('click',function(){
    var r=ROUTES[b.dataset.r];S=BASE.slice().concat(r[2]);picking=false;stage=7;sel=7;render();toast(r[0]+' — timeline updated')})});
  var msg={sub:'Opens the subject picker',slot:'Suggests opportunities for that slot',clu:'Opens the cluster',
   deck:'Opens the pathway deck',stream:'Shows what this stream does to each pathway',pod:'Opens the session',
   mentor:'Opens their stage-by-stage journey',opp:'Opens this opportunity',int:'Edit what you are interested in',
   edit:'Edit your profile',export:'Builds a one-page PDF you can share',addact:'Add an activity',addaw:'Add an award'};
  Object.keys(msg).forEach(function(k){$$('[data-a="'+k+'"]').forEach(function(b){b.addEventListener('click',function(){toast(msg[k])})})});
}
$$('#mnav button,#dock button').forEach(function(b){b.addEventListener('click',function(){
  tab=b.dataset.t;render();window.scrollTo({top:0,behavior:'smooth'})})});
$('#navi').addEventListener('click',function(){toast('Ask Navi about anything on this page')});
render();
</script>
</body>
</html>
