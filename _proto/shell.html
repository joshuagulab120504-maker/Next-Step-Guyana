<div id="app">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="./index.html" id="logo" aria-label="Next Step Guyana home">
        <span class="logo-tile"><img src="logo.png" alt=""></span>
        <span class="wordmark"><b>NEXT STEP</b><small>GUYANA</small></span>
      </a>
      <div class="top-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="top-q" placeholder="Search" aria-label="Search Next Step" autocomplete="off"/>
      </div>
      <button type="button" class="top-msg" id="top-msg" aria-label="Messages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v10H8l-4 3V6z"/></svg>
        <span class="msg-badge" id="msg-badge" hidden>0</span>
      </button>
      <button type="button" class="top-av" id="arch-pill" data-nav="pathway" aria-label="Your profile">
        <span class="av" aria-hidden="true">You</span>
        <span class="setup-dot" id="setup-dot" aria-hidden="true"></span>
      </button>
    </div>
    <div class="gold-rule" aria-hidden="true"></div>
  </header>

  <div class="shell">
    <aside class="rail left" id="left-rail">
      <nav class="lnav" aria-label="Primary">
        <button type="button" class="on" id="nav-feed" data-nav="feed">Feed</button>
        <button type="button" id="nav-pathway" data-nav="pathway">My Pathway</button>
        <button type="button" id="nav-sessions" data-nav="sessions">Happening</button>
      </nav>

      <div class="card sec-card next-decision" id="next-decision"></div>

      <div class="card sec-card browse-topics">
        <span class="eyebrow">Browse by topic</span>
        <div class="chip-row" id="browse-topics"></div>
      </div>
    </aside>

    <main id="main"></main>

    <aside class="rail right" id="right-rail">
      <div class="card sec-card">
        <span class="eyebrow">Trending threads</span>
        <div class="rail-list" id="trending"></div>
      </div>

      <div class="card sec-card" id="replies-rail" hidden>
        <span class="eyebrow">Replies to you</span>
        <div class="rail-list" id="replies-list"></div>
      </div>

      <div class="card sec-card">
        <span class="eyebrow">Closing soon</span>
        <div class="rail-list" id="closing"></div>
      </div>
    </aside>
  </div>

  <nav class="dock" id="dock" aria-label="Primary">
    <button type="button" class="dock-item on" id="dock-feed" data-tab="feed" data-nav="feed" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
      Feed
    </button>
    <button type="button" class="dock-item" id="dock-network" data-tab="network" aria-label="Network">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3 2.5-5 6-5s6 2 6 5"/><path d="M14.5 19c.3-2 1.8-3.5 4-3.5 1.2 0 2.3.4 3 1"/></svg>
      Network
    </button>
    <button type="button" class="dock-item dock-post" id="dock-post" aria-label="Post">
      <span class="post-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      Post
    </button>
    <button type="button" class="dock-item" id="dock-pathway" data-tab="pathway" data-nav="pathway" aria-label="Pathway">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/><path d="M12 7v3M12 14v3"/></svg>
      Pathway
    </button>
    <button type="button" class="dock-item" id="dock-alerts" data-tab="notifications" aria-label="Alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V10a6 6 0 1 1 12 0v6l2 2H4l2-2z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
      Alerts
      <span class="dock-badge" id="dock-badge" hidden></span>
    </button>
  </nav>

  <div class="scrim" id="scrim" hidden></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-bar">
      <button type="button" class="icon-btn" id="sheet-back" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="titles">
        <div class="sheet-crumb" id="sheet-crumb"></div>
        <div class="sheet-title" id="sheet-title">Details</div>
      </div>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
