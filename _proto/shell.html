<div id="app">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="./index.html" id="logo" aria-label="Next Step Guyana home">
        <span class="logo-tile"><img src="logo.png" alt=""></span>
        <span class="wordmark"><b>NEXT STEP</b><small>GUYANA</small></span>
      </a>
      <button type="button" class="arch-pill" id="arch-pill" data-nav="pathway" aria-label="Your profile">
        <span class="av" aria-hidden="true">You</span>
        <span class="arch-label"><span class="arch-sub">Profile</span>Not set up</span>
      </button>
    </div>
    <div class="gold-rule" aria-hidden="true"></div>
  </header>

  <div class="shell">
    <aside class="rail left" id="left-rail">
      <nav class="lnav" aria-label="Primary">
        <button type="button" class="on" id="nav-feed" data-nav="feed">Feed</button>
        <button type="button" id="nav-pathway" data-nav="pathway">My Pathway</button>
        <button type="button" id="nav-sessions" data-nav="sessions">Sessions</button>
      </nav>

      <div class="card sec-card next-decision" id="next-decision"></div>

      <div class="card sec-card browse-topics">
        <span class="eyebrow">Browse by topic</span>
        <div class="chip-row" id="browse-topics"></div>
      </div>
    </aside>

    <main id="main"></main>

    <aside class="rail right" id="right-rail">
      <div class="card sec-card">
        <span class="eyebrow">Trending threads</span>
        <div class="rail-list" id="trending"></div>
      </div>

      <div class="card sec-card" id="replies-rail" hidden>
        <span class="eyebrow">Replies to you</span>
        <div class="rail-list" id="replies-list"></div>
      </div>

      <div class="card sec-card">
        <span class="eyebrow">Closing soon</span>
        <div class="rail-list" id="closing"></div>
      </div>
    </aside>
  </div>

  <nav class="dock" id="dock" aria-label="Mobile primary">
    <button type="button" class="dock-item on" id="dock-feed" data-nav="feed">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Feed
    </button>
    <button type="button" class="dock-item" id="dock-sessions" data-nav="sessions">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
      Sessions
    </button>
    <button type="button" class="dock-item" id="dock-pathway" data-nav="pathway">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/><path d="M12 7v3M12 14v3"/></svg>
      Pathway
      <span class="dock-badge" id="dock-badge" hidden></span>
    </button>
  </nav>

  <div class="scrim" id="scrim" hidden></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-bar">
      <button type="button" class="icon-btn" id="sheet-back" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="titles">
        <div class="sheet-crumb" id="sheet-crumb"></div>
        <div class="sheet-title" id="sheet-title">Details</div>
      </div>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
