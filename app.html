<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Next Step Guyana · Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet"/>
<style>
/* Next Step Guyana single-file prototype shell */
/* fonts loaded via link */

:root{
--navy:#0a2d52; --navy-deep:#061c33; --navy-mid:#0f4272;
--ink:#12233a; --mid:#4a5b70; --body:#4a5b70; --muted:#7b8b9e; --faint:#7b8b9e;
--paper:#f0f3f7; --card:#ffffff; --line:#e1e8f0; --line-soft:#eef2f7;
--gold:#f4c945; --gold-deep:#e8b924; --gold-soft:#fdf5dd; --gold-line:#ecd894; --ochre:#a8801f;
--alert:#b93b30; --green:#0d7a4f; --green-soft:#e7f6ee; --blue:#1c5f9e; --blue-soft:#e8f1fa;
--r:16px; --pill:999px;
--shadow:0 1px 2px rgba(15,39,64,.04), 0 8px 24px rgba(15,39,64,.04);
--serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
--sans:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
--header-h:72px;
--feed-gap:12px;
--r-feed:14px;
/* Type scale */
--t-display:28px; --t-display-lh:1.15; --t-display-ls:-0.02em;
--t-h2:19px; --t-h2-lh:1.25; --t-h2-ls:-0.01em;
--t-h3:15px; --t-h3-lh:1.35; --t-h3-ls:0;
--t-body:14.5px; --t-body-lh:1.55; --t-body-ls:0;
--t-small:12.5px; --t-small-lh:1.45; --t-small-ls:0;
--t-micro:10.5px; --t-micro-lh:1.3; --t-micro-ls:0.08em;
--w-regular:400; --w-medium:500; --w-bold:700;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--mid);
  font-family:var(--sans);
  font-size:var(--t-body);
  font-weight:var(--w-regular);
  line-height:var(--t-body-lh);
  letter-spacing:var(--t-body-ls);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
body.sheet-open{overflow:hidden}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue)}
[hidden]{display:none!important}

/* Default headings are sans. Serif only via .display / .serif / feed titles / archetype. */
h1,h2,h3,h4{
  font-family:var(--sans);
  font-weight:var(--w-bold);
  color:var(--ink);
  margin:0;
}
h1{
  font-size:var(--t-h2);
  line-height:var(--t-h2-lh);
  letter-spacing:var(--t-h2-ls);
  text-wrap:balance;
}
h2{
  font-size:var(--t-h2);
  line-height:var(--t-h2-lh);
  letter-spacing:var(--t-h2-ls);
  font-weight:var(--w-bold);
  text-wrap:balance;
}
h3{
  font-size:var(--t-h3);
  line-height:var(--t-h3-lh);
  letter-spacing:var(--t-h3-ls);
  font-weight:var(--w-medium);
}
h4{
  font-size:var(--t-h3);
  line-height:var(--t-h3-lh);
  font-weight:var(--w-medium);
}
p{margin:0;max-width:68ch}

.display,.serif,
.path-hero h1,
.page-path .path-hero h1{
  font-family:var(--serif);
  font-size:var(--t-display);
  line-height:var(--t-display-lh);
  letter-spacing:var(--t-display-ls);
  font-weight:var(--w-bold);
  color:var(--ink);
  text-wrap:balance;
}

.sr{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
:focus-visible{outline:3px solid #2f7fd4;outline-offset:2px}

.eyebrow,.field-label,.type-tag,.age-box .l,.date-box .w,.day-box .l,.now-line .eyebrow,.now b{
  display:inline-block;
  font-family:var(--sans);
  font-size:var(--t-micro);
  font-weight:var(--w-medium);
  letter-spacing:var(--t-micro-ls);
  line-height:var(--t-micro-lh);
  text-transform:uppercase;
  color:var(--ochre);
}

.small, .meta, .sub, .count-line, .places, .muted, .hint, .caveat, .footer-note, .reason{
  font-size:var(--t-small);
  line-height:var(--t-small-lh);
  letter-spacing:var(--t-small-ls);
  font-weight:var(--w-regular);
  color:var(--muted);
}
.muted{color:var(--muted)}

.tabular, .count-line, .day-box .n, .date-box .d, .age-box .n, .places, .cap, .capacity{
  font-variant-numeric:tabular-nums;
}

/* Long-form article */
.article{font-size:var(--t-body);line-height:var(--t-body-lh);color:var(--mid);max-width:68ch}
.article > p:first-of-type::first-letter{
  float:left;font-family:var(--serif);font-size:42px;font-weight:var(--w-bold);
  line-height:0.85;padding:6px 10px 0 0;color:var(--navy);
}

/* Header */
.top{
  position:sticky;top:0;z-index:80;
  background:linear-gradient(100deg,var(--navy-deep),var(--navy-mid));
  box-shadow:0 6px 22px rgba(6,28,51,.22);
  color:#fff;
}
.gold-rule{
  height:4px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold) 45%,#f7dd8a);
}
.top-inner{
  width:min(1268px,calc(100% - 32px));
  margin:0 auto;
  min-height:var(--header-h);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 0;
}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;min-width:0}
.logo-tile{
  width:46px;height:46px;border-radius:12px;background:#f8f6ef;
  overflow:hidden;flex:0 0 46px;
}
.logo-tile img{width:100%;height:100%;object-fit:contain}
.wordmark{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.wordmark b{
  font-family:var(--sans);font-size:var(--t-h2);font-weight:var(--w-bold);
  letter-spacing:var(--t-h2-ls);
}
.wordmark small{
  font-size:var(--t-micro);font-weight:var(--w-medium);letter-spacing:.18em;color:#b3cae0;margin-top:3px;
  text-transform:uppercase;line-height:var(--t-micro-lh);
}
.arch-pill{
  display:inline-flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  border-radius:var(--pill);padding:6px 12px 6px 6px;
  color:#fff;font-size:var(--t-small);font-weight:var(--w-medium);max-width:min(280px,52vw);
  cursor:pointer;min-height:44px;
}
.arch-pill:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28)}
.arch-pill .av{
  width:30px;height:30px;border-radius:50%;background:var(--gold);
  color:var(--navy-deep);display:grid;place-items:center;
  font-size:var(--t-micro);font-weight:var(--w-medium);flex:0 0 30px;
}
.arch-pill .arch-label{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;line-height:1.2;
  font-weight:var(--w-medium);
}
.arch-pill .arch-sub{
  display:block;font-size:var(--t-micro);font-weight:var(--w-medium);letter-spacing:var(--t-micro-ls);
  color:#b3cae0;text-transform:uppercase;line-height:var(--t-micro-lh);
}

/* Layout shell */
.shell{
  width:min(1268px,calc(100% - 32px));
  margin:22px auto 40px;
  display:grid;
  grid-template-columns:1fr;
  gap:26px;
  align-items:start;
}
.rail{display:none}
.rail.sticky,.rail{position:sticky;top:104px;max-height:calc(100vh - 120px);overflow:auto}
#main{min-width:0}

@media(min-width:768px){
  .shell{grid-template-columns:184px minmax(0,1fr);gap:18px;margin:18px auto 36px;width:min(100% - 28px,980px)}
  .rail.left{display:flex;flex-direction:column;gap:14px}
  body{padding-bottom:24px}
  .dock{display:none!important}
}
@media(min-width:1024px){
  .shell{grid-template-columns:200px minmax(0,1fr);gap:22px;width:min(100% - 36px,1100px)}
}
@media(min-width:1121px){
  .shell{grid-template-columns:224px minmax(0,1fr) 280px;gap:26px;width:min(1268px,calc(100% - 40px))}
  .rail.right{display:flex;flex-direction:column;gap:14px}
}
@media(min-width:1280px){
  .shell{grid-template-columns:224px minmax(0,1fr) 296px;width:min(1268px,calc(100% - 48px))}
}

/* Cards */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;
}
.card.clickable{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card.clickable:hover{border-color:#c3d3e4}
.card + .card{margin-top:12px}
.sec-card .eyebrow{margin-bottom:8px}
.sec-card h3,.sec-card h4{margin-bottom:6px}

/* Pills / chips — metadata, never larger than body */
.p,.pill,.type-tag{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:var(--pill);border:1px solid var(--line);
  background:#fff;color:var(--muted);
  font-family:var(--sans);
  font-size:11px;font-weight:var(--w-medium);padding:5px 9px;
  line-height:1;min-height:22px;height:22px;box-sizing:border-box;
}
.p.gold,.pill.gold{background:var(--gold-soft);border-color:var(--gold-line);color:var(--ochre)}
.p.green,.pill.green{background:var(--green-soft);border-color:#b7e0cb;color:var(--green)}
.p.red,.pill.red{background:#fbeceb;border-color:#efc4bf;color:var(--alert)}
.p.blue,.pill.blue{background:var(--blue-soft);border-color:#c5d8ec;color:var(--blue)}
.p.dot::before,.pill.dot::before{
  content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85;
}
.type-tag{
  text-transform:uppercase;letter-spacing:var(--t-micro-ls);
  font-size:var(--t-micro);line-height:var(--t-micro-lh);height:auto;min-height:22px;padding:5px 9px;
}
.type-tag::before{
  content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9;
}
.type-tag.q{background:var(--gold-soft);border-color:var(--gold-line);color:var(--ochre)}
.type-tag.story{background:var(--green-soft);border-color:#b7e0cb;color:var(--green)}
.type-tag.opp{background:var(--blue-soft);border-color:#c5d8ec;color:var(--blue)}
.type-tag.sess{background:#e8eef6;border-color:#c5d3e4;color:var(--navy-mid)}
.type-tag.journey{background:#e8eef6;border-color:#b8c9dc;color:var(--navy-deep)}
.tagrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip-row,.filters{
  display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.chip-row::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.chip-row button,.filters button,.filters .filter{
  flex:0 0 auto;min-height:32px;height:auto;border:1px solid var(--line);background:#fff;
  border-radius:var(--pill);padding:5px 9px;font-size:11px;font-weight:var(--w-medium);color:var(--muted);
}
.chip-row button.on,.filters button.on,.filters .filter.on{
  background:var(--navy);border-color:var(--navy);color:#fff;
}

/* Buttons — 14px / 500, sentence case */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid transparent;
  background:var(--gold);color:var(--navy-deep);
  font-family:var(--sans);
  font-size:14px;font-weight:var(--w-medium);letter-spacing:0;text-decoration:none;
  transition:background .15s,border-color .15s,color .15s;
}
.btn:hover{background:var(--gold-deep)}
.btn.g,.btn.ghost{
  background:#fff;border-color:var(--line);color:var(--ink);
}
.btn.g:hover,.btn.ghost:hover{background:#f7fafd;border-color:#cdd8e6}
.btn.g.on,.btn.ghost.on,.btn.following{
  background:var(--gold-soft);border-color:var(--gold-line);color:var(--ochre);
}
.btn.sm{min-height:40px;padding:8px 13px;font-size:14px;font-weight:var(--w-medium);border-radius:11px}
.btn.q,.btn.quiet{
  background:transparent;border-color:transparent;color:var(--muted);
  min-height:36px;padding:6px 8px;font-weight:var(--w-medium);font-size:var(--t-small);
}
.btn.q:hover,.btn.quiet:hover{color:var(--alert)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* Left rail nav — recedes */
.lnav{display:flex;flex-direction:column;gap:2px}
.lnav button{
  display:flex;align-items:center;gap:10px;
  min-height:0;padding:8px 10px;border-radius:10px;
  font-size:14px;font-weight:var(--w-medium);color:var(--mid);text-align:left;
}
.lnav button svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lnav button:hover{background:var(--line-soft);color:var(--ink)}
.lnav button.on{background:var(--navy);color:#fff;font-weight:var(--w-medium)}
.next-decision .due{font-size:var(--t-small);color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.next-decision .caveat{font-size:var(--t-small);color:var(--muted);margin-top:8px;line-height:var(--t-small-lh)}
.browse-topics .chip-row{flex-wrap:wrap;overflow:visible;padding:0}
.browse-topics .chip-row button{min-height:22px;padding:5px 9px;font-size:11px;font-weight:var(--w-medium)}

/* Right rail lists */
.rail-list{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.rail-list button{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  width:100%;text-align:left;padding:10px 8px;border-radius:10px;
  font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.35;
}
.rail-list button:hover{background:var(--line-soft)}
.rail-list .meta{font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap}
.close-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-soft)}
.close-row:first-of-type{border-top:0}
.close-row strong{display:block;font-size:13.5px;color:var(--ink)}
.close-row span{font-size:12px;color:var(--muted)}

/* Feed page chrome */
.page-feed{display:flex;flex-direction:column;gap:0}
.page-feed > h1{
  font-family:var(--sans);
  font-size:clamp(26px, 4.2vw, 34px);
  line-height:1.15;
  letter-spacing:-0.02em;
  font-weight:var(--w-bold);
  margin:0 0 10px;
  color:var(--ink);
  text-wrap:balance;
}
.page-head{margin-bottom:14px}
.page-head .eyebrow{margin-bottom:6px}
.muted{color:var(--muted)}
.push-right{margin-left:auto}
.field-label{
  display:block;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);margin:0 0 6px;
}

.search, input.search{
  display:block;width:100%;box-sizing:border-box;
  background:var(--navy);border:1px solid var(--navy);border-radius:14px;
  padding:14px 16px;margin:14px 0 12px;
  box-shadow:0 8px 22px rgba(6,28,51,.18);
  font-size:14.5px;font-weight:500;color:#fff;
  caret-color:var(--gold);
}
input.search::placeholder{color:#9bb8d4;font-weight:500}
input.search:focus{
  outline:none;border-color:var(--navy-mid);
  box-shadow:0 0 0 3px rgba(244,201,69,.28), 0 8px 22px rgba(6,28,51,.22);
}
input.search::-webkit-search-cancel-button{filter:invert(1);opacity:.7;cursor:pointer}
.search-wrap{
  display:flex;align-items:center;gap:10px;background:var(--navy);
  border:1px solid var(--navy);border-radius:14px;padding:12px 15px;
  box-shadow:0 8px 22px rgba(6,28,51,.18);margin:14px 0 12px;
}
.search-wrap svg{width:18px;height:18px;color:#9bb8d4;flex:0 0 18px}
.search-wrap input{flex:1;border:0;outline:0;background:transparent;font-size:14.5px;min-width:0;padding:0;color:#fff;caret-color:var(--gold)}
.search-wrap input::placeholder{color:#9bb8d4}

.filters{
  display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;
  scrollbar-width:none;-ms-overflow-style:none;margin-bottom:4px;
}
.filters::-webkit-scrollbar{display:none}
.filters .filter, .filters button.filter{
  flex:0 0 auto;min-height:40px;border:1px solid var(--line);background:#fff;
  border-radius:var(--pill);padding:8px 14px;font-size:12.5px;font-weight:700;
  color:#5b7089;letter-spacing:-0.005em;
}
.filters .filter.on{
  background:var(--navy);border-color:var(--navy);color:#fff;
}
.filters .filter[data-filter="questions"].on{background:#8a6a14;border-color:#8a6a14}
.filters .filter[data-filter="stories"].on{background:var(--green);border-color:var(--green)}
.filters .filter[data-filter="opportunities"].on{background:var(--blue);border-color:var(--blue)}
.filters .filter[data-filter="sessions"].on{background:var(--navy-mid);border-color:var(--navy-mid)}
.filters .filter[data-filter="journeys"].on{background:var(--navy-deep);border-color:var(--navy-deep)}

.recent-row{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.recent-row::-webkit-scrollbar{display:none}
.recent-row .chip{
  flex:0 0 auto;min-height:36px;border:1px dashed #c9d4e2;background:#fff;
  border-radius:var(--pill);padding:7px 12px;font-size:12px;font-weight:700;color:var(--muted);
}

.count-line{
  font-size:12px;font-weight:600;color:var(--faint);
  margin:4px 0 12px;letter-spacing:.02em;
}

.composer{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px 18px;margin:10px 0 6px;
}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg button, .seg-btn{
  min-height:40px;padding:8px 14px;border-radius:var(--pill);
  border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:#5b7089;
}
.seg button.on, .seg-btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.composer textarea{
  width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;background:var(--paper);
  font-size:14.5px;line-height:1.55;font-family:var(--sans);
}
.composer textarea:focus{outline:none;border-color:#9bb4ce;background:#fff}
.composer-foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;
}
.composer-foot select{
  min-height:42px;border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;background:#fff;font-size:13px;font-weight:600;
}
.composer-foot label, .composer-foot .check{
  display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);
}
.composer-foot .btn{margin-left:auto}
.dup-box, .dupe{
  margin-top:12px;background:var(--gold-soft);border:1px solid var(--gold-line);
  border-radius:12px;padding:14px 16px;
}
.dup-box .serif, .dupe h4{margin:6px 0 4px;font-size:17px}
.dup-box .muted, .dupe p{font-size:13.5px;color:var(--muted)}

/* Shared feed card anatomy — social, flat, one rhythm */
.stream{display:flex;flex-direction:column;gap:var(--feed-gap)}
.stream .feed-card{margin-top:0}
.feed-card{
  position:relative;
  padding:14px 16px 12px;
  border-radius:var(--r-feed);
  border:1px solid var(--line);
  background:var(--card);
  box-shadow:none;
  overflow:hidden;
  transition:background .15s, border-color .15s;
}
.feed-card:hover{
  border-color:#d0dae6;
  background:#fcfdff;
  box-shadow:none;
}
.feed-card.kind-q,
.feed-card.kind-story,
.feed-card.kind-opp,
.feed-card.kind-sess,
.feed-card.kind-journey,
.opp-card,
.sess-card,
.journey-card{
  border-left:1px solid var(--line);
  background:var(--card);
  padding:14px 16px 12px;
}
.feed-card h3,
.feed-card .hook{
  font-family:var(--sans);
  font-size:16px;
  line-height:1.35;
  letter-spacing:-0.01em;
  font-weight:var(--w-bold);
  margin:10px 0 0;
  color:var(--ink);
  text-wrap:pretty;
}
.feed-card > p,
.feed-card .clamp3,
.feed-card .now-line{
  margin-top:6px;
  font-size:var(--t-body);
  line-height:var(--t-body-lh);
  color:var(--mid);
  max-width:68ch;
  font-weight:var(--w-regular);
}
.clamp3{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.card-head{
  display:flex;align-items:center;gap:10px;min-width:0;
}
.card-head .meta{flex:1;min-width:0}
.card-head .name{
  font-size:13.5px;font-weight:var(--w-bold);color:var(--ink);line-height:1.25;
  letter-spacing:0;font-family:var(--sans);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kind-sess .card-head .name{
  white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.card-head .sub, .meta .sub{
  font-size:12px;font-weight:var(--w-regular);color:var(--muted);margin-top:2px;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.follow-btn{
  flex:0 0 auto;
  min-height:32px !important;
  padding:4px 8px !important;
  font-size:12.5px !important;
  color:var(--blue) !important;
}
.follow-btn.following{color:var(--muted) !important}
.follow-btn:hover{color:var(--navy) !important}

.av, .avatar{
  width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:var(--w-bold);flex:0 0 40px;
  letter-spacing:0;
}
.av.gold, .av.av-gold, .avatar.gold{background:var(--gold);color:var(--navy-deep)}
.av.av-anon, .avatar.anon{background:#dce5ef;color:#5b7089}
.av.av-desk{background:var(--navy-mid);color:#fff}

.flag-row{
  display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:8px;
}
.mine-tag{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:var(--w-medium);color:var(--green);
  background:var(--green-soft);border-radius:6px;padding:3px 7px;line-height:1.2;
}
.mine-tag.alert{color:var(--alert);background:#fbeceb}

.pill-row{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:12px;
}
.type-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:var(--w-medium);letter-spacing:.08em;text-transform:uppercase;
  border-radius:var(--pill);padding:5px 10px;line-height:1.2;border:1px solid transparent;
}
.type-tag::before{
  content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9;
}
.type-tag.q{background:var(--gold-soft);border-color:var(--gold-line);color:var(--ochre)}
.type-tag.story{background:var(--green-soft);border-color:#b7e0cb;color:var(--green)}
.type-tag.opp{background:var(--blue-soft);border-color:#c5d8ec;color:var(--blue)}
.type-tag.sess{background:#e8eef6;border-color:#c5d3e4;color:var(--navy-mid)}
.type-tag.journey{background:#e8eef6;border-color:#b8c9dc;color:var(--navy-deep)}

.card-actions{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;
}
.card-foot{
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);
  font-size:12.5px;font-weight:var(--w-medium);color:var(--blue);
}

/* Engagement row — social footer */
.engage{
  display:flex;align-items:center;gap:12px;
  margin-top:12px;padding-top:10px;
  border-top:1px solid var(--line-soft);
  min-height:36px;
}
.engage-stat,
.engage-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--sans);
  font-size:12.5px;font-weight:var(--w-medium);
  color:var(--muted);line-height:1;min-height:32px;padding:0;
  background:none;border:0;cursor:pointer;
}
.engage-btn:hover{color:var(--ink)}
.engage-btn.primary{color:var(--blue);font-weight:var(--w-bold)}
.engage-btn.primary:hover{color:var(--navy)}
.engage-btn svg{flex:0 0 auto}
.engage-cta{
  margin-left:auto;
  font-size:12.5px;font-weight:var(--w-medium);color:var(--blue);
}
.card-cats{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;
}
.cat-chip{
  display:inline-flex;align-items:center;
  max-width:100%;
  border:1px solid #c5d8ec;
  background:var(--blue-soft);
  color:var(--blue);
  border-radius:8px;
  padding:5px 10px;
  font-family:var(--sans);
  font-size:11.5px;font-weight:var(--w-bold);line-height:1.2;
  letter-spacing:0;
  text-transform:none;
  cursor:pointer;
}
button.cat-chip:hover{background:#dcebff;border-color:#9fc0e0}
span.cat-chip{cursor:default}
.cat-chip.soft{
  background:#f3f6fa;border-color:var(--line);color:var(--mid);font-weight:var(--w-medium);
}
.cat-chip.soft.open{
  background:var(--green-soft);border-color:#b7e0cb;color:var(--green);
}
.reply-preview{
  margin-top:10px;
  border-left:2px solid var(--line);
  border-radius:0;
  padding:6px 0 6px 12px;
  background:transparent;
  border-top:0;border-right:0;border-bottom:0;
  font-size:13.5px;line-height:1.45;color:var(--body);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.reply-preview strong{
  display:inline;font-family:var(--sans);font-size:13.5px;font-weight:var(--w-bold);color:var(--ink);
}
.prompt-line, .opp-prompt{
  margin-top:8px;font-size:13px;font-weight:var(--w-medium);color:var(--blue);
}

/* Session — compact date chip */
.date-chip{
  flex:0 0 44px;width:44px;height:44px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;background:var(--navy);color:#fff;text-align:center;gap:1px;
}
.date-chip .d{
  font-family:var(--sans);font-size:15px;font-weight:var(--w-bold);line-height:1;color:#fff;
}
.date-chip .w{
  font-size:9px;font-weight:var(--w-medium);letter-spacing:.06em;
  text-transform:uppercase;color:#b3cae0;line-height:1;
}
.sess-meta{
  display:flex;align-items:center;gap:10px;margin-top:10px;
  font-size:12.5px;color:var(--muted);font-weight:var(--w-regular);
}
.sess-meta .cap, .sess-main .cap, .capacity{
  flex:1;max-width:160px;height:4px;background:#e7edf4;border-radius:99px;overflow:hidden;margin:0;
}
.sess-meta .cap > span, .sess-main .cap > span, .capacity i, .capacity > span{
  display:block;height:100%;background:var(--green);border-radius:99px;
}

/* Legacy session date-box (detail / sheets) */
.sess-row{display:flex;align-items:stretch;width:100%;min-width:0}
.date-box,.datebox{
  flex:0 0 76px;width:76px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:6px;padding:16px 8px;background:linear-gradient(180deg,var(--navy-mid),var(--navy-deep));
  color:#fff;text-align:center;
}
.date-box .d,.datebox b{
  display:flex;align-items:center;justify-content:center;
  width:46px;min-height:46px;border-radius:11px;background:#fff;
  font-family:var(--serif);font-size:21px;font-weight:700;line-height:1;color:var(--navy);
}
.date-box .w,.datebox span,.datebox small{
  display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#b3cae0;margin-top:2px;
}
.sess-main{flex:1;min-width:0;padding:14px 16px 16px}
.sess-main h3{margin:8px 0 6px}
.sess-main .muted{font-size:13px;line-height:1.4}
.sess-card .places{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.sess-mini{display:flex;align-items:stretch;gap:0;padding:0;overflow:hidden}
.sess-mini .date-box{border-radius:var(--r) 0 0 var(--r)}
.sess-mini > div:last-child{flex:1;min-width:0;padding:12px 14px}

/* Journey — same anatomy as other posts */
.j-head, .jhead{
  background:linear-gradient(100deg,var(--navy-deep),var(--navy-mid));color:#fff;
  padding:16px 18px;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;
}
.j-head .name, .jhead strong{
  display:block;font-family:var(--sans);font-size:15px;font-weight:700;color:#fff;letter-spacing:-0.01em;
}
.j-head .sub, .jhead small{
  display:block;font-size:12px;color:#b3cae0;font-weight:500;margin-top:3px;
}
.j-head .av.gold{background:var(--gold);color:var(--navy-deep)}
.age-box, .age{
  text-align:center;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);
  border-radius:11px;padding:7px 10px;min-width:58px;
}
.age-box .n, .age b{
  display:block;font-family:var(--serif);font-size:20px;font-weight:700;color:var(--gold);line-height:1;
}
.age-box .l, .age small{
  font-size:8px;letter-spacing:.12em;color:#bfd4e6;font-weight:700;margin-top:3px;
}
.hook, .jbody .hook{
  font-family:var(--sans);font-weight:var(--w-bold);font-size:16px;line-height:1.35;
  color:var(--ink);margin:10px 0 0;letter-spacing:-0.01em;
}
.now-line, .now{
  margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.45;
}
.now-line .eyebrow, .now b{
  font-size:10px;letter-spacing:.14em;color:var(--ochre);font-weight:800;margin-right:7px;
}
.kind-journey .card-actions, .jbody .actions{
  display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px 18px;margin-top:4px;
}

/* Pathway */
.path-hero{
  background:linear-gradient(100deg,var(--navy-deep),var(--navy-mid));
  color:#fff;border-radius:var(--r);padding:22px 22px 20px;
  box-shadow:0 14px 34px rgba(6,28,51,.18);margin-bottom:16px;
}
.path-hero h1,.path-hero .eyebrow{color:#fff}
.path-hero .eyebrow{color:var(--gold)}
.path-hero .subline{color:#b3cae0;margin-top:8px;max-width:42rem;line-height:1.5}
.path-hero .stat-pills .p{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.onboard-banner{margin:12px 0 16px;border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-soft),#fff)}
.onboard-banner h2{margin:6px 0 8px;font-size:clamp(22px,2.4vw,28px)}
.onboard-banner .muted{margin-top:2px;line-height:1.5}
.opt.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(10,45,82,.12)}
.composer-foot{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px
}
.composer-foot .field-label{width:100%;margin:0}
.composer-foot select{flex:1;min-width:160px;min-height:44px}
.composer-foot .check{flex:1;min-width:180px;margin:0}
.composer-foot .btn{margin-left:auto}
.reply-card{display:flex;gap:12px;align-items:flex-start}
.reply-body{flex:1;min-width:0}
.empty.card{text-align:left;padding:22px}
.empty h3{margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:12px}
.path-hero .eyebrow{color:var(--gold)}
.path-hero h2{color:#fff;font-size:38px;margin-top:6px}
.path-hero .sub{margin-top:6px;color:#b3cae0;font-size:14.5px;font-weight:600}
.stat-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stat-pills span{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  border-radius:var(--pill);padding:7px 12px;font-size:12.5px;font-weight:700;color:#e8f0f8;
}
.profile-row{
  display:flex;align-items:center;gap:14px;margin-bottom:18px;
}
.ring{
  width:52px;height:52px;border-radius:50%;flex:0 0 52px;
  background:conic-gradient(var(--gold) var(--pct,0%), var(--line) 0);
  display:grid;place-items:center;
}
.ring > i{
  width:40px;height:40px;border-radius:50%;background:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);
}
.profile-row .grow{flex:1;min-width:0}
.profile-row strong{display:block;font-size:15px;color:var(--ink)}
.profile-row p{font-size:13px;color:var(--muted);margin-top:2px}

.timeline{position:relative;padding:8px 0 8px 18px}
.timeline::before{
  content:"";position:absolute;left:16px;top:22px;bottom:22px;width:2px;background:var(--line);
}
.t-node{
  position:relative;padding:0 0 22px 28px;
}
.t-node:last-child{padding-bottom:0}
.t-dot{
  position:absolute;left:0;top:2px;width:34px;height:34px;border-radius:50%;
  border:2px solid var(--line);background:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);z-index:1;
}
.t-node.done .t-dot{background:var(--navy);border-color:var(--navy);color:#fff}
.t-node.now .t-dot{
  background:var(--gold);border-color:var(--gold);color:var(--navy-deep);
  box-shadow:0 0 0 5px var(--gold-soft);
}
.t-node h4{font-size:16px}
.t-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre);margin-top:2px}
.t-dec{
  margin-top:10px;border:1px solid var(--gold-line);background:var(--gold-soft);
  border-radius:12px;padding:12px 14px;
}
.t-dec strong{display:block;font-size:14px;color:var(--ink)}
.t-dec p{font-size:13px;color:var(--muted);margin-top:4px}
.step-row{
  display:flex;align-items:center;gap:10px;margin-top:8px;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;
}
.step-row .grow{flex:1;min-width:0}
.step-row strong{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.step-row span{font-size:11.5px;color:var(--faint);font-weight:600}
.empty-dash{
  margin-top:8px;border:1px dashed #c9d4e2;border-radius:11px;
  padding:12px 14px;font-size:13px;color:var(--muted);
}

/* For you carousel */
.foryou{margin-top:28px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head p{margin-top:4px;font-size:13.5px;color:var(--muted)}
.rail-arrows{display:flex;gap:7px}
.arrow{
  width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:11px;
  color:#5b7089;font-size:15px;line-height:1;
}
.arrow:hover{background:#f7fafd;border-color:#cdd8e6}
.arrow[disabled]{opacity:.4;cursor:default}
.carousel,.fy-rail{
  display:flex;gap:13px;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  margin-inline:-18px;padding-inline:18px;scroll-padding-inline:18px;
  padding-block:4px 14px;
}
.carousel::-webkit-scrollbar,.fy-rail::-webkit-scrollbar{display:none}
.fy-card{
  flex:0 0 clamp(248px,74vw,296px);scroll-snap-align:start;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 19px;
  display:flex;flex-direction:column;min-height:186px;
}
.fy-card h4{font-size:17px;line-height:1.3}
.fy-card p{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.fy-card .fy-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:14px}
.fy-note{margin:4px 0 0;font-size:12.5px;color:var(--faint);font-weight:600}

/* Mentor rows */
.mentor-row{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-top:1px solid var(--line-soft);cursor:pointer;
}
.mentor-row:first-child{border-top:0}
.mentor-row .grow{flex:1;min-width:0}
.mentor-row strong{display:block;font-size:14.5px;color:var(--ink)}
.mentor-row span{font-size:12.5px;color:var(--muted)}

/* Setup / check options */
.setup-opt,.opt{
  display:block;width:100%;text-align:left;
  border:1px solid var(--line);background:#fff;border-radius:13px;
  padding:14px 16px;margin-top:10px;min-height:56px;
  transition:border-color .15s,background .15s;
}
.setup-opt:hover,.opt:hover,.setup-opt.on,.opt.on{
  border-color:var(--navy);background:var(--blue-soft);
}
.setup-opt strong,.opt strong{display:block;font-size:15px;color:var(--ink)}
.setup-opt span,.opt span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.progress-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.progress-bars i{height:4px;border-radius:99px;background:var(--line)}
.progress-bars i.on{background:var(--gold)}

/* Detail heroes */
.opp-hero{
  background:linear-gradient(135deg,#0f4272,#1c5f9e 55%,#2a78b8);
  color:#fff;border-radius:var(--r);padding:22px;
  box-shadow:0 14px 34px rgba(6,28,51,.18);margin-bottom:16px;
}
.opp-hero h2,.sess-hero h2,.topic-hero h2{color:#fff;margin-top:8px}
.opp-hero p,.sess-hero p,.topic-hero p{color:#cfe0f0;margin-top:8px;font-size:15px}
.sess-hero{
  background:linear-gradient(100deg,var(--navy-deep),var(--navy-mid));
  color:#fff;border-radius:var(--r);padding:22px;
  box-shadow:0 14px 34px rgba(6,28,51,.18);margin-bottom:16px;
}
.topic-hero{
  background:linear-gradient(135deg,var(--gold-deep),var(--gold) 50%,#f7dd8a);
  color:var(--navy-deep);border-radius:var(--r);padding:22px;margin-bottom:16px;
}
.topic-hero h2{color:var(--navy-deep)}
.topic-hero p{color:#5a4810}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.facts .card{padding:14px}
.facts .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ochre)}
.facts .v{margin-top:4px;font-size:14.5px;font-weight:700;color:var(--ink)}
.callout{border-radius:12px;padding:14px 16px;margin:12px 0;font-size:14px;line-height:1.5}
.callout.blue{background:var(--blue-soft);border:1px solid #c5d8ec;color:var(--ink)}
.callout.green{background:var(--green-soft);border:1px solid #b7e0cb;color:var(--ink)}
.callout.gold{background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--ink)}
.callout.alert{background:#fbeceb;border:1px solid #efc4bf;border-left:4px solid var(--alert)}
.entry-steps{counter-reset:entry;margin:12px 0;padding:0;list-style:none}
.entry-steps li{
  position:relative;padding:12px 12px 12px 48px;margin-top:8px;
  background:#fff;border:1px solid var(--line);border-radius:12px;
}
.entry-steps li::before{
  counter-increment:entry;content:counter(entry);
  position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;
  background:var(--navy);color:#fff;display:grid;place-items:center;
  font-size:12px;font-weight:800;
}
.tip-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.tip-list li{
  list-style:none;padding-left:28px;position:relative;font-size:14px;color:var(--body);
}
.tip-list li::before{
  content:"";position:absolute;left:0;top:4px;width:16px;height:16px;border-radius:50%;
  background:var(--gold);box-shadow:inset 0 0 0 4px var(--gold-soft);
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2,.facts{grid-template-columns:1fr}}

/* Journey detail extras */
.quote{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.4;color:var(--ink);margin:16px 0}
.moment{
  display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;
  padding:14px 0;border-top:1px solid var(--line-soft);
}
.moment .age{background:var(--gold-soft);border-color:var(--gold-line);color:var(--navy)}
.moment .age b{color:var(--navy-deep)}
.moment .age small{color:var(--ochre)}
.moment p{font-family:var(--serif);font-size:17.5px;line-height:1.4;color:var(--ink)}
.moment .flag{margin-top:6px;font-size:12.5px;font-weight:800;color:var(--alert)}
.route-card{margin-top:10px;padding:14px 16px}
.route-card .t-label{margin-bottom:4px}
.route-card .lesson{margin-top:6px;font-size:13.5px;color:var(--muted)}
.step-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.step-chips button{
  min-height:44px;border:1px solid var(--line);background:#fff;border-radius:var(--pill);
  padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);
}
.step-chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.step-chips button.on::after{content:" ✓";font-weight:800}

/* Thread */
.thread-q{margin-bottom:16px}
.thread-reply{padding:14px 0;border-top:1px solid var(--line-soft)}
.thread-reply .who{font-family:var(--serif);font-size:17px;color:var(--ink)}
.reply-box{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.reply-box textarea{
  width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;background:#fff;resize:vertical;
}

/* Dock */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:grid;grid-template-columns:1fr 1fr 1fr;
  min-height:64px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  box-shadow:0 -8px 24px rgba(15,39,64,.06);
}
.dock button{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;min-height:52px;border-radius:14px;
  font-size:11px;font-weight:700;color:var(--muted);
}
.dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button.on{background:var(--gold-soft);color:var(--ochre)}
.dock-badge{
  position:absolute;top:6px;right:calc(50% - 22px);
  min-width:16px;height:16px;padding:0 4px;border-radius:99px;
  background:var(--alert);color:#fff;font-size:9px;font-weight:800;
  display:grid;place-items:center;line-height:1;
}

/* Back to top + compose FAB */
.fab-post{
  position:fixed;right:14px;z-index:49;
  bottom:calc(76px + env(safe-area-inset-bottom));
  min-height:52px;height:52px;padding:0 18px 0 14px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--gold);color:var(--navy-deep);border:0;
  box-shadow:0 10px 28px rgba(6,28,51,.28);
  cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:var(--w-bold);letter-spacing:0;
  transition:transform .15s, background .15s, box-shadow .15s, border-radius .15s, padding .15s;
}
.fab-post:hover{background:var(--gold-deep);transform:translateY(-2px)}
.fab-post .fab-label{line-height:1}
.fab-post.open{
  background:var(--navy);color:#fff;
  width:52px;height:52px;padding:0;border-radius:50%;
  transform:rotate(45deg);
}
.fab-post.open .fab-label{display:none}
.fab-post.open:hover{background:var(--navy-mid)}
.fab-post svg{display:block;flex:0 0 auto}

.back-top{
  position:fixed;right:14px;z-index:48;
  bottom:calc(144px + env(safe-area-inset-bottom));
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--navy);color:#fff;border:0;
  box-shadow:0 8px 22px rgba(6,28,51,.28);
  cursor:pointer;
  transition:transform .15s, opacity .15s, background .15s;
}
.back-top:hover{background:var(--navy-mid);transform:translateY(-2px)}
.back-top[hidden]{display:none!important}
@media(min-width:768px){
  .fab-post{
    bottom:28px;right:22px;
    min-height:60px;height:60px;padding:0 24px 0 18px;gap:10px;
    font-size:16px;
  }
  .fab-post svg{width:22px;height:22px}
  .fab-post.open{width:60px;height:60px;padding:0}
  .back-top{bottom:104px;right:22px;width:48px;height:48px}
}

.compose-panel{
  margin:0;padding:0;border:0;box-shadow:none;background:transparent;
}
.compose-panel .seg{margin-bottom:14px}
.compose-panel textarea{
  min-height:140px;font-size:16px;line-height:1.5;
}
.sheet-body .compose-panel{max-width:36rem}

.page-sessions{display:flex;flex-direction:column;gap:16px}
.page-sessions > h1{
  font-family:var(--sans);font-size:var(--t-h2);font-weight:var(--w-bold);
  color:var(--ink);margin:0;
}
.page-sessions > .lede{
  margin:-6px 0 0;font-size:var(--t-body);color:var(--muted);max-width:52ch;
}

.sess-opp{margin-top:10px;padding:14px 16px}
.sess-opp h3{margin:8px 0 6px;font-size:15px;font-weight:var(--w-bold)}
.sess-opp .card-cats{margin-top:0}
.sess-opp .card-actions{margin-top:12px}
.page-sessions .section > h2{margin-bottom:4px}
.page-sessions .section > .muted{margin-bottom:10px}

/* Sheet + scrim */
.scrim{
  position:fixed;top:calc(var(--header-h) + 4px);left:0;right:0;bottom:0;z-index:60;
  background:rgba(6,20,36,.66);
}
.sheet{
  position:fixed;top:calc(var(--header-h) + 4px);right:0;bottom:0;z-index:70;
  width:min(800px,100%);background:var(--paper);
  display:flex;flex-direction:column;
  box-shadow:-12px 0 40px rgba(6,28,51,.18);
  transform:translateY(14px);opacity:0;
  transition:transform 240ms ease,opacity 240ms ease;
}
.sheet.open{transform:translateY(0);opacity:1}
.sheet-bar{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;gap:10px;
  min-height:58px;padding:10px 14px;
  background:rgba(243,246,250,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.sheet-bar .icon-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;color:var(--ink);flex:0 0 40px;
}
.sheet-bar .titles{flex:1;min-width:0}
.sheet-crumb{font-size:11.5px;font-weight:700;color:var(--faint)}
.sheet-title{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;overflow:auto;padding:18px 18px 40px}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:max(24px, calc(72px + env(safe-area-inset-bottom)));z-index:80;
  transform:translateX(-50%);
  max-width:min(420px,calc(100% - 28px));
  background:var(--navy-deep);color:#fff;
  border-radius:12px;padding:12px 18px;
  font-size:14px;font-weight:700;text-align:center;
  box-shadow:0 12px 28px rgba(6,28,51,.28);
}
@media(min-width:768px){
  .toast{bottom:28px}
}

.disclaimer{margin-top:28px;font-size:12px;color:var(--faint);line-height:1.45}
.empty{text-align:left;padding:22px}
.empty h3{margin-bottom:6px}
.empty p{color:var(--muted);font-size:14.5px}

@media(max-width:767px){
  .fy-rail,.carousel{margin-inline:-12px;padding-inline:12px;scroll-padding-inline:12px}
  .rail-arrows{display:none}
  .composer-foot{flex-direction:column;align-items:stretch}
  .composer-foot .btn{margin-left:0;width:100%;order:9}
  .composer-foot select,.composer-foot .check{min-width:0;width:100%}
  .top-inner{width:min(100% - 20px,1268px);gap:10px}
  .shell{width:min(100% - 20px,1268px);margin:14px auto 28px;gap:16px}
  .wordmark b{font-size:16px}
  .wordmark small{letter-spacing:.22em}
  .logo-tile{width:42px;height:42px;flex-basis:42px;border-radius:11px}
  .arch-pill{font-size:12px;padding:5px 10px 5px 5px;max-width:min(240px,48vw)}
  .card{padding:14px 15px}
  .stream{
    gap:12px;
    margin-inline:0;
    background:transparent;
    border:0;
  }
  .stream .feed-card,
  .stream .feed-card.kind-q,
  .stream .feed-card.kind-story,
  .stream .feed-card.kind-opp,
  .stream .feed-card.kind-sess,
  .stream .feed-card.kind-journey{
    border-radius:var(--r-feed);
    border:1px solid var(--line);
    box-shadow:none;
    padding:14px 16px 12px;
  }
  .stream .feed-card:last-child{border-bottom:1px solid var(--line)}
  .stream .feed-card:hover{background:#fcfdff}
  .sess-row{flex-direction:row}
  .sess-main{padding:12px 14px 14px}
  .sess-main .cap{max-width:none}
  .sess-meta .cap{max-width:none}
  .path-hero{padding:18px 16px}
  .path-hero h2{font-size:clamp(26px,7vw,34px)}
  .sheet{width:100%}
  .sheet-body{padding:14px 14px 36px}
  .moment{grid-template-columns:56px 1fr;gap:10px}
  .quote{font-size:18px}
}

@media(max-width:480px){
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  .top-inner{width:min(100% - 16px,1268px);min-height:64px}
  .shell{width:min(100% - 16px,1268px);margin-top:12px}
  .wordmark small{display:none}
  .arch-pill .arch-sub{display:none}
  .arch-pill{padding:4px 8px 4px 4px;gap:7px}
  .search{padding:11px 12px}
  .composer{padding:12px}
  .seg button{min-height:38px;padding:7px 11px;font-size:12.5px}
  .dock{padding:4px 6px calc(4px + env(safe-area-inset-bottom));min-height:60px}
  .dock button{min-height:48px;font-size:10.5px;border-radius:12px}
  .toast{bottom:max(18px, calc(66px + env(safe-area-inset-bottom)))}
}

@media(min-width:641px) and (max-width:767px){
  .grid2,.facts{grid-template-columns:1fr 1fr}
  .shell{width:min(100% - 28px,720px)}
  .composer-foot{flex-direction:row;align-items:center}
  .composer-foot .btn{width:auto;margin-left:auto}
  .composer-foot select{width:auto;min-width:160px}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .sheet,.btn,.card.clickable,.lnav button,.dock button,.arch,.offer{transition:none}
  .sheet{transform:none;opacity:1}
  .fy-rail,.carousel{scroll-behavior:auto}
}

/* =========================================================
   UI SYSTEM — classes emitted by JS (pathway, sheets, forms)
   ========================================================= */

.page-path,.page-feed,.detail,.setup{
  display:flex;flex-direction:column;gap:16px;
}
.page-path > .section,
.detail > section,
.detail > .card{margin:0}

.section{
  display:flex;flex-direction:column;gap:12px;
}
.section > h2{
  font-size:clamp(22px,2.4vw,26px);
  margin:4px 0 0;
  letter-spacing:-.018em;
}
.section > h3,.detail > section > h3{
  font-size:18px;margin:4px 0 2px;
}
.hint,.footer-note,.reason,.caveat{
  font-size:13.5px;line-height:1.5;color:var(--muted);
}
.caveat{margin-top:8px}
.t25{font-family:var(--serif);font-size:25px;line-height:1.2;color:var(--ink);margin:0}
.t27{font-family:var(--serif);font-size:27px;line-height:1.18;color:var(--ink);margin:0}
.soft-ask{font-size:14px;color:var(--muted);margin-top:8px}
.mtxt{margin:0}

/* Detail heroes */
.hero{
  border-radius:var(--r);padding:22px 22px 20px;margin:0;
  box-shadow:0 14px 34px rgba(6,28,51,.16);color:#fff;
}
.hero h2{color:#fff;margin:8px 0 0;font-size:clamp(24px,2.8vw,30px)}
.hero > p{color:#cfe0f0;margin-top:8px;font-size:15px;line-height:1.5}
.hero .eyebrow{color:var(--gold)}
.hero .p{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.hero .card-actions{margin-top:16px}
.hero .btn.g{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
.hero .btn.g:hover{background:rgba(255,255,255,.2)}
.hero.navy{background:linear-gradient(100deg,var(--navy-deep),var(--navy-mid))}
.hero.blue{background:linear-gradient(135deg,#0f4272,#1c5f9e 55%,#2a78b8)}
.hero.gold{
  background:linear-gradient(135deg,var(--gold-deep),var(--gold) 50%,#f7dd8a);
  color:var(--navy-deep);
}
.hero.gold h2,.hero.gold .eyebrow{color:var(--navy-deep)}
.hero.gold > p{color:#5a4810}
.hero.gold .p{background:rgba(10,45,82,.08);border-color:rgba(10,45,82,.12);color:var(--navy)}
.hero .quote{color:inherit;border:0;margin:12px 0 0;padding:0;font-size:20px}

/* Facts / steps / tips */
.facts4,.facts{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0;
}
.facts4 > div,.facts .card{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;
}
.facts4 .eyebrow,.facts .k{
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ochre);
}
.facts4 p:not(.eyebrow){margin-top:4px;font-size:14.5px;font-weight:700;color:var(--ink)}

.steps-ol,.entry-steps{
  counter-reset:entry;margin:4px 0;padding:0;list-style:none;
  display:flex;flex-direction:column;gap:8px;
}
.steps-ol li,.entry-steps li{
  position:relative;padding:12px 14px 12px 48px;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  font-size:14.5px;line-height:1.45;
}
.steps-ol li::before,.entry-steps li::before{
  counter-increment:entry;content:counter(entry);
  position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;
  background:var(--navy);color:#fff;display:grid;place-items:center;
  font-size:12px;font-weight:800;
}

.tips,.tip-list{
  display:flex;flex-direction:column;gap:8px;margin:4px 0;padding:0;list-style:none;
}
.tips li,.tip-list li{
  position:relative;padding:10px 12px 10px 34px;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  font-size:14px;line-height:1.45;color:var(--body);
}
.tips li::before,.tip-list li::before{
  content:"";position:absolute;left:12px;top:14px;width:12px;height:12px;border-radius:50%;
  background:var(--gold);box-shadow:inset 0 0 0 3px var(--gold-soft);
}
.tips.gold li{background:var(--gold-soft);border-color:var(--gold-line)}

.blocker,.alert-push{
  border-radius:12px;padding:14px 16px;margin:8px 0;
  background:#fbeceb;border:1px solid #efc4bf;border-left:4px solid var(--alert);
  font-size:14px;line-height:1.5;color:var(--ink);
}
.blocker strong{display:block;margin-bottom:4px}

.q-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.q-list li,.qmark{
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;
  font-size:14px;line-height:1.45;
}

.opp-mini,.row-btn,.mini-post{
  display:block;width:100%;text-align:left;
  padding:14px 16px;margin-top:8px;
  border:1px solid var(--line);border-radius:12px;background:#fff;
  font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.35;
}
.opp-mini:hover,.row-btn:hover,.mini-post:hover{border-color:#c3d3e4;background:#f7fafd}
.drop{margin-top:10px}

.btn.danger{
  background:#fbeceb;border:1px solid #efc4bf;color:var(--alert);
}
.btn.danger:hover{background:#f6d7d4}
.btn.following,.btn.g.following{
  background:var(--gold-soft);border-color:var(--gold-line);color:var(--ochre);
}

/* Setup */
.setup h2{font-size:clamp(22px,2.6vw,28px);margin:8px 0 6px}
.setup .hint{margin-bottom:8px}
.setup .prog{
  height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px;
}
.setup .prog > span{
  display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));
  border-radius:99px;
}
.opt-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.setup .btn{margin-top:8px;align-self:flex-start}

/* Pathway */
.path-hero h1{
  font-size:clamp(28px,4vw,38px);color:#fff;margin-top:6px;line-height:1.12;
}
.path-hero.onboarded .subline{margin-top:8px}
.gold-edge{
  border-left:4px solid var(--gold-deep);
  background:linear-gradient(180deg,var(--gold-soft),#fff);
}
.gold-edge h2,.page-path > .card > h2{margin-bottom:8px;font-size:clamp(20px,2.2vw,24px)}
.gold-edge p,.page-path > .card > p{margin:0 0 10px;line-height:1.55}
.gold-edge .btn,.page-path > .card > .btn{margin-top:4px}

.next-dec{
  display:flex;gap:16px;align-items:flex-start;padding:18px !important;
}
.next-dec > div:last-child{flex:1;min-width:0}
.next-dec h2{font-size:clamp(20px,2.2vw,24px);margin:4px 0 8px}
.next-dec > div > p{line-height:1.5}
.day-box{
  flex:0 0 72px;width:72px;text-align:center;
  background:var(--navy);color:#fff;border-radius:14px;padding:14px 8px;
}
.day-box .n{
  font-family:var(--serif);font-size:26px;font-weight:700;line-height:1;color:var(--gold);
}
.day-box .l{
  display:block;margin-top:6px;font-size:10px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:#b3cae0;
}

.timeline{
  position:relative;padding:4px 0 4px 8px;
  display:flex;flex-direction:column;gap:0;
}
.timeline::before{
  content:"";position:absolute;left:23px;top:28px;bottom:28px;width:2px;background:var(--line);
}
.tl-item{
  position:relative;display:grid;grid-template-columns:48px 1fr;gap:12px;
  padding:0 0 22px;
}
.tl-item:last-child{padding-bottom:0}
.node{
  width:34px;height:34px;border-radius:50%;margin-left:6px;z-index:1;
  display:grid;place-items:center;
  background:#fff;border:2px solid var(--line);
  font-size:12px;font-weight:800;color:var(--muted);
}
.node.cur{border-color:var(--gold-deep);background:var(--gold);color:var(--navy-deep);box-shadow:0 0 0 4px var(--gold-soft)}
.node.done{border-color:var(--green);background:var(--green);color:#fff}
.tl-body{min-width:0;padding-top:2px}
.tl-body h3{font-size:17px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.here-lab{font-family:var(--sans);font-size:12px;font-weight:750;color:var(--ochre);letter-spacing:.02em}
.dec-box{
  margin-top:10px;padding:12px 14px;border-radius:12px;
  background:var(--line-soft);border:1px solid var(--line);
}
.dec-box p{margin-top:4px;font-size:14px;color:var(--ink);line-height:1.45}
.taken-row{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  margin-top:8px;padding:10px 12px;border-radius:11px;
  background:#fff;border:1px solid var(--line);font-size:13.5px;
}
.tl-empty{
  margin-top:8px;padding:10px 12px;border-radius:11px;
  border:1px dashed #c9d4e2;font-size:13px;color:var(--faint);
}

.slots{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;
}
.slot{
  min-height:88px;padding:14px;border-radius:14px;text-align:left;
  border:1px dashed #c9d4e2;background:#fff;
  font-size:13px;font-weight:700;color:var(--muted);line-height:1.35;
  display:flex;flex-direction:column;gap:4px;align-items:flex-start;
}
.slot strong{display:block;font-size:14px;color:var(--ink)}
.slot span{font-weight:600;color:var(--faint)}
.slot.filled,.slot.on{
  border-style:solid;border-color:var(--navy);background:var(--blue-soft);color:var(--ink);
}
.check-list{
  margin:8px 0 0;padding:0;list-style:none;
  display:flex;flex-direction:column;gap:8px;
}
.check-list li{
  position:relative;padding:8px 8px 8px 28px;font-size:14px;line-height:1.45;
}
.check-list li::before{
  content:"";position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:50%;
  border:2px solid var(--green);background:var(--green-soft);
}

.car-card{
  flex:0 0 clamp(248px,74vw,296px);scroll-snap-align:start;
  padding:16px 16px 14px !important;
}
.car-card h3,.car-card h4{font-size:17px;margin:8px 0 6px}
.car-card p{font-size:13.5px;color:var(--muted);line-height:1.45}

/* Forms in sheets */
.detail input[type="text"],
.detail input[type="email"],
.detail input:not([type]),
.detail textarea,
.detail select,
.reply-composer textarea,
.reply-box textarea,
#book-q,#edit-text,#edit-cat,#thread-reply{
  width:100%;box-sizing:border-box;
  min-height:46px;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;background:#fff;font:inherit;color:var(--ink);
}
.detail textarea,.reply-composer textarea,#edit-text,#thread-reply{
  min-height:96px;resize:vertical;line-height:1.5;
}
.detail input:focus-visible,
.detail textarea:focus-visible,
.detail select:focus-visible,
#book-q:focus-visible,
.reply-composer textarea:focus-visible{
  outline:3px solid #2f7fd4;outline-offset:2px;
}
.reply-composer,.reply-box{
  display:flex;flex-direction:column;gap:10px;margin-top:8px;
}
.reply-label{font-size:13px;font-weight:700;color:var(--ink)}
.detail .check,.reply-composer .check{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--line-soft);font-size:13px;line-height:1.45;color:var(--body);
}
.detail .check input,.reply-composer .check input{margin-top:3px;flex:0 0 auto}
.detail > .btn,.detail .card-actions{margin-top:8px}

/* Rail */
#next-decision .btn,#next-decision h3{margin-top:8px}
#next-decision h3{font-size:15px;line-height:1.35}
.browse-topics .chip-row{flex-wrap:wrap;overflow:visible;padding:0;gap:7px}
.browse-topics .chip-row button{
  min-height:34px;padding:7px 11px;font-size:12px;border-radius:var(--pill);
  border:1px solid var(--line);background:#fff;font-weight:700;color:#5b7089;
}
.browse-topics .chip-row button:hover{border-color:#c3d3e4;color:var(--ink)}
.rail-list .rail-link,.rail-list button.rail-link{
  display:block;width:100%;text-align:left;
  padding:10px 8px;border-radius:10px;
  font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.35;
}
.rail-list .rail-link:hover{background:var(--line-soft)}

/* Composer cleanup */
.composer.card{box-shadow:var(--shadow)}
.composer-foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;
}
.composer-foot .field-label{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);border:0;
}
.composer-foot select{flex:1 1 160px;min-width:140px;min-height:44px}
.composer-foot .check{flex:1 1 180px;min-width:160px;margin:0;padding:0;border:0;background:transparent}
.composer-foot .btn{flex:0 0 auto;margin-left:auto}

.onboard-banner .card-actions{margin-top:12px}
.card-actions .btn svg{flex:0 0 auto}

.step-chips button.chip.step.on::after{content:" ✓";font-weight:800}
.step-chips button.chip.step{
  min-height:44px;border:1px solid var(--line);background:#fff;border-radius:var(--pill);
  padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);
}
.step-chips button.chip.step.on{
  background:var(--navy);border-color:var(--navy);color:#fff;
}

.arch-pill.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3)}

@media(max-width:767px){
  .facts4{grid-template-columns:1fr}
  .next-dec{flex-direction:column;gap:12px}
  .day-box{flex-basis:auto;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px}
  .day-box .l{margin-top:0}
  .hero{padding:18px 16px}
  .card-actions{gap:8px}
  .onboard-banner .card-actions .btn{flex:1 1 calc(50% - 8px)}
  .composer-foot{flex-direction:column;align-items:stretch}
  .composer-foot .btn{width:100%;margin-left:0}
  .composer-foot select,.composer-foot .check{width:100%;min-width:0;flex:none}
}
@media(max-width:480px){
  :root{--header-h:64px}
  .onboard-banner .card-actions .btn{flex:1 1 100%;width:100%}
  .stream{gap:10px}
}

<div id="app">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="./index.html" id="logo" aria-label="Next Step Guyana home">

  <div class="shell">
    <aside class="rail left" id="left-rail">
      <nav class="lnav" aria-label="Primary">
        <button type="button" class="on" id="nav-feed" data-nav="feed">Feed</button>
        <button type="button" id="nav-pathway" data-nav="pathway">My Pathway</button>

      </div>
    </aside>

    <main id="main"></main>

    <aside class="rail right" id="right-rail">

        <span class="eyebrow">Trending threads</span>

        <div class="rail-list" id="replies-list"></div>

        <div class="rail-list" id="closing"></div>
      </div>

    <button type="button" class="dock-item on" id="dock-feed" data-nav="feed">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Feed

    <button type="button" class="dock-item" id="dock-pathway" data-nav="pathway">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/><path d="M12 7v3M12 14v3"/></svg>
      Pathway

    </button>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
      Happening
    </button>
  </nav>

  <button type="button" class="fab-post" id="fab-post" aria-label="Make a post">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span class="fab-label">Post</span>
  </button>

  <button type="button" class="back-top" id="back-top" aria-label="Back to top" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <div class="scrim" id="scrim" hidden></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-bar">
      <button type="button" class="icon-btn" id="sheet-back" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>

        <div class="sheet-title" id="sheet-title">Details</div>
      </div>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function byId(id) {
  return document.getElementById(id);
}

function toast(msg) {
  var el = byId('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function () {
    el.hidden = true;
  }, 3200);
}

function stageIndex(key) {
  var i;
  for (i = 0; i < STAGES.length; i++) {
    if (STAGES[i].key === key) return i;
  }
  return 0;
}

function stageByKey(key) {
  return STAGES[stageIndex(key)] || STAGES[0];
}

function daysUntil(iso) {
  if (!iso) return null;
  var due = new Date(iso + 'T12:00:00');
  var now = new Date();
  var ms = due.getTime() - now.getTime();
  return Math.max(0, Math.ceil(ms / 86400000));
}

function author(id) {
  return AUTHORS[id] || { name: id, init: '?', role: '', pos: '', system: true };
}

function isFollowing(id) {
  return S.following.indexOf(id) !== -1;
}

function toggleFollow(id) {
  var i = S.following.indexOf(id);
  if (i === -1) {
    S.following.push(id);
    toast('Following ' + author(id).name + '. New posts and nodes reach your feed.');
  } else {
    S.following.splice(i, 1);
    toast('Unfollowed ' + author(id).name + '.');
  }
  paint();
  render();
}

function isSaved(id) {
  return S.saved.indexOf(id) !== -1;
}

function toggleSave(id) {
  var i = S.saved.indexOf(id);
  if (i === -1) {
    S.saved.push(id);
    toast('Saved for later.');
  } else {
    S.saved.splice(i, 1);
    toast('Removed from saved.');
  }
  paint();
  render();
}

function isInspired(id) {
  return S.inspired.indexOf(id) !== -1;
}

function toggleInspired(id) {
  var item = feedById(id);
  var i = S.inspired.indexOf(id);
  if (i === -1) {
    S.inspired.push(id);
    if (item) item.insp = (item.insp || 0) + 1;
    toast('Marked as inspired.');
  } else {
    S.inspired.splice(i, 1);
    if (item && item.insp > 0) item.insp -= 1;
    toast('Removed from inspired.');
  }
  paint();
  render();
}

function takenHas(key) {
  var i;
  for (i = 0; i < S.taken.length; i++) {
    if (S.taken[i].key === key) return true;
  }
  return false;
}

function addTaken(entry, silent) {
  if (takenHas(entry.key)) return false;
  S.taken.push(entry);
  if (!silent) toast('Added to ' + (stageByKey(entry.stage).name || entry.stage) + '.');
  return true;
}

function ensureReplyIds(item) {
  if (!item || !item.replies) return;
  var i;
  for (i = 0; i < item.replies.length; i++) {
    if (!item.replies[i].id) item.replies[i].id = item.id + '-r' + i;
  }
}

function studentLabel() {
  if (S.onboarded && S.form) return S.form + ' student, ' + (S.region || 'Guyana');
  return 'Student';
}

function youName() {
  if (S.onboarded && S.archetype) return 'You (' + S.archetype + ')';
  return 'You';
}

function removeTaken(key) {
  S.taken = S.taken.filter(function (t) {
    return t.key !== key;
  });
  toast('Removed.');
}

function toggleTaken(entry) {
  if (takenHas(entry.key)) {
    removeTaken(entry.key);
  } else {
    addTaken(entry);
  }
  paint();
  render();
}

function pushRecent(kind, id, label) {
  var i;
  S.recent = S.recent.filter(function (r) {
    return !(r.kind === kind && r.id === id);
  });
  S.recent.unshift({ kind: kind, id: id, label: label });
  if (S.recent.length > 6) S.recent.length = 6;
}

function feedById(id) {
  var i;
  for (i = 0; i < FEED.length; i++) {
    if (FEED[i].id === id) return FEED[i];
  }
  return null;
}

function sessionById(id) {
  var i;
  for (i = 0; i < SESSIONS.length; i++) {
    if (SESSIONS[i].id === id) return SESSIONS[i];
  }
  return null;
}

function oppOpenAtStage(opp, stageKey) {
  if (!opp || !stageKey) return false;
  var idx = stageIndex(stageKey);
  return opp.stages.indexOf(idx) !== -1;
}

function lockBody(on) {
  if (on) document.body.className = (document.body.className + ' sheet-open').replace(/\s+/g, ' ').trim();
  else document.body.className = document.body.className.replace(/\bsheet-open\b/g, '').replace(/\s+/g, ' ').trim();
}

function go(v) {
  NAV.push(v);
  openSheet();
  paint();
}

function back() {
  NAV.pop();
  if (!NAV.length) {
    closeSheet();
    return;
  }
  paint();
}

function hideSheetUi() {
  NAV = [];
  var sh = byId('sheet');
  if (sh) {
    sh.hidden = true;
    sh.className = sh.className.replace(/\bopen\b/g, '').replace(/\s+/g, ' ').trim();
  }
  var scrim = byId('scrim');
  if (scrim) scrim.hidden = true;
  lockBody(false);
}

function closeSheet() {
  hideSheetUi();
  render();
}

function openSheet() {
  var sh = byId('sheet');
  sh.hidden = false;
  if ((' ' + sh.className + ' ').indexOf(' open ') === -1) sh.className = (sh.className + ' open').replace(/\s+/g, ' ').trim();
  byId('scrim').hidden = false;
  lockBody(true);
  byId('sheet-body').scrollTop = 0;
}

function setView(v) {
  hideSheetUi();
  S.view = v;
  if (v === 'pathway') S.unread = 0;
  render();
}

function paint() {
  if (!NAV.length) return;
  var top = NAV[NAV.length - 1];
  var fn = VIEWS[top.t];
  if (!fn) return;
  var out = fn(top);
  byId('sheet-crumb').textContent = out.crumb || '';
  byId('sheet-title').textContent = out.title || '';
  byId('sheet-back').hidden = NAV.length < 2;
  byId('sheet-body').innerHTML = out.html || '';
  byId('sheet-body').scrollTop = 0;
  if (out.after) out.after();
  renderChrome();
  if (typeof syncFab === 'function') syncFab();
}

function searchHay(item) {
  var parts = [item.title || '', item.cat || '', item.text || '', item.who || '', item.kind || ''];
  var i, a, o, j, r, sess, jour;
  if (item.body) {
    for (i = 0; i < item.body.length; i++) parts.push(item.body[i]);
  }
  if (item.replies) {
    for (i = 0; i < item.replies.length; i++) {
      r = item.replies[i];
      parts.push(r.text || '');
      parts.push(r.who || '');
      if (r.a) {
        a = author(r.a);
        parts.push(a.name, a.pos || '');
      }
    }
  }
  if (item.author) {
    a = author(item.author);
    parts.push(a.name, a.pos || '');
  }
  if (item.opp && OPPS[item.opp]) {
    o = OPPS[item.opp];
    parts.push(o.name, o.one || '', o.cat || '');
  }
  if (item.session) {
    sess = sessionById(item.session);
    if (sess) parts.push(sess.title, sess.pod || '', sess.cat || '');
  }
  if (item.journey && JOURNEYS[item.journey]) {
    jour = JOURNEYS[item.journey];
    a = author(item.journey);
    parts.push(a.name, jour.hook || '', jour.now || '', jour.place || '', jour.field || '', jour.quote || '');
  }
  return parts.join(' ').toLowerCase();
}

function filteredFeed() {
  var q = (S.query || '').trim().toLowerCase();
  var out = [];
  var i, item, ok;
  for (i = 0; i < FEED.length; i++) {
    item = FEED[i];
    ok = true;
    if (S.filter === 'questions' && item.kind !== 'question') ok = false;
    if (S.filter === 'stories' && item.kind !== 'story') ok = false;
    if (S.filter === 'opportunities' && item.kind !== 'opportunity') ok = false;
    if (S.filter === 'sessions' && item.kind !== 'session') ok = false;
    if (S.filter === 'journeys' && item.kind !== 'journey') ok = false;
    if (ok && q && searchHay(item).indexOf(q) === -1) ok = false;
    if (ok) out.push(item);
  }
  return out;
}

function resultCountLine(list) {
  var q = (S.query || '').trim();
  if (q) return list.length + ' results for "' + q + '"';
  if (S.filter === 'all') return list.length + ' posts, tap any of them to go deeper';
  var labels = {
    questions: 'questions',
    stories: 'stories',
    opportunities: 'opportunities',
    sessions: 'sessions',
    journeys: 'journeys'
  };
  return list.length + ' under ' + (labels[S.filter] || S.filter);
}

function dupHintHtml(draft) {
  if (!draft || draft.length < 12) return '';
  var low = draft.toLowerCase();
  var i, j, hit, item, replyNames, raeka;
  for (i = 0; i < DUP_MAP.length; i++) {
    for (j = 0; j < DUP_MAP[i].keys.length; j++) {
      if (low.indexOf(DUP_MAP[i].keys[j]) !== -1) {
        hit = DUP_MAP[i].id;
        break;
      }
    }
    if (hit) break;
  }
  if (!hit) return '';
  item = feedById(hit);
  if (!item) return '';
  replyNames = [];
  raeka = false;
  if (item.replies) {
    for (i = 0; i < item.replies.length; i++) {
      if (item.replies[i].a) {
        replyNames.push(author(item.replies[i].a).name);
        if (item.replies[i].a === 'raeka') raeka = true;
      }
    }
  }
  return (
    '<div class="dup-box" id="dup-box">' +
    '<p class="eyebrow">Someone already asked this</p>' +
    '<p class="serif"><strong>' +
    esc(item.title) +
    '</strong></p>' +
    '<p class="muted">' +
    (item.replies ? item.replies.length : 0) +
    ' replies, including one from ' +
    esc(raeka ? 'Raeka Persaud' : replyNames[0] || 'a mentor') +
    '.</p>' +
    '<div class="card-actions">' +
    '<button type="button" class="btn sm" data-open="thread" data-id="' +
    esc(item.id) +
    '">Read that thread</button>' +
    '<button type="button" class="btn sm g" id="dup-dismiss">Ask mine anyway</button>' +
    '</div></div>'
  );
}

function finishSetup() {

  var html =
    '<div class="setup">' +
    '<div class="prog"><span style="width:' +
    pct +
    '%"></span></div>' +

      '<button type="button" class="opt' +
      (selected ? ' on' : '') +
      '" data-setup-key="' +
      esc(q.key) +

function renderTimeline() {
  var cur = stageIndex(S.stage);

  var i, st, steps, j, t;
  for (i = 0; i < STAGES.length; i++) {
    st = STAGES[i];
    html += '<div class="tl-item' + (i === cur ? ' here' : '') + (i < cur ? ' done' : '') + '">';
    if (i < cur) html += '<div class="node done">' + iconCheck() + '</div>';
    else if (i === cur) html += '<div class="node cur"></div>';
    else html += '<div class="node">' + (i + 1) + '</div>';
    html += '<div class="tl-body"><h3>' + esc(st.name);
    if (i === cur) html += '<span class="here-lab">, you are here</span>';
    html += '</h3><p class="muted">' + esc(st.label) + '</p>';
    if (i >= cur) {
      html +=
        '<div class="dec-box"><p class="eyebrow">Key decision</p><p>' +
        esc(st.dec.t) +
        '</p></div>';
    }
    steps = S.taken.filter(function (x) {
      return x.stage === st.key;
    });
    if (steps.length) {
      for (j = 0; j < steps.length; j++) {
        t = steps[j];
        html +=
          '<div class="taken-row"><span class="p">' +
          esc(t.kind) +

          esc(t.key) +
          '">Remove</button></div>';
      }
    } else if (i >= cur) {
      html += '<div class="tl-empty">Nothing here yet</div>';
    }
    html += '</div></div>';
  }
  html += '</div></section>';
  return html;
