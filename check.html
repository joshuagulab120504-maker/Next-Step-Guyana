<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1930">
<title>60-Second Self-Check — Next Step Guyana</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');
:root{
  --navy:#0a1930;--navy2:#123a52;--teal:#0e7a4f;--teal2:#149b62;--gold:#eeb52f;
  --ink:#101a28;--muted:#5c6c7e;--paper:#f5f7fa;--white:#fff;--line:#dfe6ec;--soft:#eaf3ee;
  --glass-bg:rgba(255,255,255,.7);--glass-line:rgba(255,255,255,.5);--radius-lg:20px;
  --shadow:0 20px 55px rgba(8,22,42,.14);
  --font-display:'Fraunces',ui-serif,Georgia,serif;--font-accent:'Sora',ui-sans-serif,sans-serif;--font-body:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--font-body)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.wrap{width:min(680px,calc(100% - 28px));margin:auto}
:focus-visible{outline:2.5px solid var(--teal2);outline-offset:2px;border-radius:6px}
h1,h2{font-family:var(--font-display);font-weight:650;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;min-height:46px;background:linear-gradient(135deg,var(--teal2),var(--teal));color:#fff;font-family:var(--font-accent);font-weight:700;font-size:14px;box-shadow:0 8px 22px rgba(14,122,79,.22)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#d99615);color:#1a1305;box-shadow:0 8px 22px rgba(238,181,47,.28)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:9px 14px;font-size:12px;min-height:38px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.header{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 18px;border-bottom:4px solid var(--teal)}
.brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-family:var(--font-accent);font-weight:800;font-size:14px}
.brand .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,var(--teal2),var(--teal));display:grid;place-items:center;font-size:14px}
.exit{margin-left:auto;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;border-radius:10px;padding:8px 12px;font-size:10.5px;font-weight:700}

.quiz-shell{padding:34px 0 80px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.quiz-count{font-family:var(--font-accent);font-size:10.5px;font-weight:800;color:var(--teal2)}
.quiz-bar{height:6px;background:#e6ede9;border-radius:8px;overflow:hidden;margin-bottom:22px}
.quiz-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#28b471);border-radius:8px;transition:.3s}
.quiz-card{background:var(--glass-bg);backdrop-filter:blur(16px);border:1px solid var(--glass-line);border-radius:var(--radius-lg);padding:28px;box-shadow:0 7px 25px rgba(10,25,48,.05)}
.quiz-card h2{font-size:24px;letter-spacing:-.02em;margin-bottom:5px}
.quiz-hint{color:var(--muted);margin:0 0 18px;font-size:12.5px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choices.compact{grid-template-columns:repeat(3,1fr)}
.choices.single-col{grid-template-columns:1fr}
.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;text-align:left;min-height:56px}
.choice strong{display:block;font-size:12.5px}
.choice small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
.choice:hover{border-color:#9fd2b6}
.choice.selected{border-color:var(--teal2);background:var(--soft);box-shadow:0 0 0 2px #cdeadd}
.multi-note{font-size:10.5px;color:var(--muted);margin-top:10px}
.quiz-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;border-top:1px solid var(--line);padding-top:15px}
@media(max-width:520px){.choices{grid-template-columns:1fr}.choices.compact{grid-template-columns:1fr 1fr}}

.loading-view{text-align:center;padding:90px 20px}
.spinner{width:50px;height:50px;border-radius:50%;border:6px solid #dce9e1;border-top-color:var(--teal);animation:spin .8s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html"><span class="mark">↗</span> NEXT STEP</a><button class="exit" onclick="location.href='index.html'">Exit</button></header>

<main class="wrap quiz-shell">
  <div id="quizArea">
    <div class="quiz-top"><span class="quiz-count" id="quizCount">QUESTION 1</span></div>
    <div class="quiz-bar"><i id="quizProgress" style="width:6%"></i></div>
    <div class="quiz-card">
      <div id="quizQuestion"></div>
      <div class="quiz-actions">
        <button class="btn ghost small" id="quizBack">Back</button>
        <button class="btn small" id="quizNext" disabled>Continue →</button>
      </div>
    </div>
  </div>

  <div class="loading-view hidden" id="loadingView">
    <div class="spinner"></div>
    <h2 id="loadingText">Building your plan…</h2>
    <p style="color:var(--muted)">One second.</p>
  </div>
</main>

<script>
/* ============================================================
   REFERENCE DATA (shared shape with my-plan.html)
   ============================================================ */
const SUBJECTS_CSEC = ['English A','English B','Mathematics','Additional Mathematics','Biology','Chemistry','Physics','Integrated Science','Social Studies','Geography','History','Caribbean History','EDPM','Principles of Accounts','Principles of Business','Economics','Technical Drawing','Agricultural Science','Food & Nutrition','Information Technology','Spanish','French','Visual Arts','Music'];
const SUBJECTS_CAPE = ['Biology','Chemistry','Physics','Pure Mathematics','Applied Mathematics','Caribbean Studies','Communication Studies','Economics','Geography','History','Law','Management of Business','Accounting','Sociology','Literatures in English','Computer Science','Agricultural Science','Environmental Science'];

const STAGES = [
  {v:'lower', t:'Forms 1–3', s:'No stream chosen yet'},
  {v:'form4', t:'Form 4', s:'Narrowing CSEC subjects'},
  {v:'form5', t:'Form 5 / CSEC', s:'Exam year'},
  {v:'postcsec', t:'Just finished CSEC', s:'Deciding the next fork'},
  {v:'sixthform', t:'Sixth Form / CAPE', s:'Studying toward university'},
  {v:'postcape', t:'Just finished CAPE', s:'UG / UWI / abroad / work'},
];

const REQUIREMENTS = {
  science:{title:'Environmental & Health Sciences', desc:'Understanding how things work to help people, communities, or the land.', mustHaveCSEC:['Biology','Chemistry'], recommendedCAPE:['Biology','Chemistry'], verified:false},
  agriculture:{title:'Agriculture & Environmental Science', desc:'Working with the land and natural resources.', mustHaveCSEC:['Agricultural Science'], recommendedCAPE:['Agricultural Science','Environmental Science'], verified:false},
  engineering:{title:'Engineering & Technical Trades', desc:'Solving problems and building things that work.', mustHaveCSEC:['Mathematics','Physics'], recommendedCAPE:['Physics','Pure Mathematics'], verified:false},
  technology:{title:'Technology & Digital Systems', desc:'Solving problems and building systems with code and tools.', mustHaveCSEC:['Mathematics'], recommendedCAPE:['Computer Science','Pure Mathematics'], verified:false},
  business:{title:'Business & Entrepreneurship', desc:'Turning ideas and organisation into something people need.', mustHaveCSEC:['Mathematics','English A'], recommendedCAPE:['Accounting','Economics','Management of Business'], verified:false},
  law:{title:'Law & Public Policy', desc:'Using justice and policy to change how things work for people.', mustHaveCSEC:['Caribbean History'], recommendedCAPE:['Law','Caribbean Studies'], verified:true},
  creative:{title:'Creative Industries & Media', desc:'Telling stories and making things that move people.', mustHaveCSEC:[], recommendedCAPE:['Literatures in English'], verified:false},
  other:{title:'Flexible / Undeclared Track', desc:"It's okay not to have one lane yet.", mustHaveCSEC:[], recommendedCAPE:[], verified:false},
};

const UNIVERSAL_QUESTIONS = [
  {key:'region', title:'Which region of Guyana is your school in?', hint:'So we can show realistic sessions and mentors.', compact:true, options:[
    {v:'r1',t:'Region 1',s:'Barima-Waini'},{v:'r2',t:'Region 2',s:'Pomeroon-Supenaam'},{v:'r3',t:'Region 3',s:'Essequibo Isl.-W. Dem.'},
    {v:'r4',t:'Region 4',s:'Demerara-Mahaica'},{v:'r5',t:'Region 5',s:'Mahaica-Berbice'},{v:'r6',t:'Region 6',s:'E. Berbice-Corentyne'},
    {v:'r7',t:'Region 7',s:'Cuyuni-Mazaruni'},{v:'r8',t:'Region 8',s:'Potaro-Siparuni'},{v:'r9',t:'Region 9',s:'Upper Takutu-Upper Essequibo'},
    {v:'r10',t:'Region 10',s:'Upper Demerara-Berbice'},
  ]},
  {key:'interests', title:'Which areas make you curious?', hint:'Choose up to three.', multi:3, options:[
    {v:'science',t:'Science & Medicine'},{v:'engineering',t:'Engineering'},{v:'business',t:'Business & Entrepreneurship'},
    {v:'law',t:'Law & Humanities'},{v:'creative',t:'Creative Industry'},{v:'agriculture',t:'Agriculture'},
    {v:'technology',t:'Technology'},{v:'other',t:'Other'},
  ]},
  {key:'priority', title:"What's weighing most on this decision?", hint:'Choose up to two.', multi:2, options:[
    {v:'affordable',t:'Affordability / funding'},{v:'family',t:'Family expectations or responsibilities'},
    {v:'work-soon',t:'Needing to work soon'},{v:'requirements',t:'Not knowing which requirements apply'},
    {v:'distance',t:'Distance or transport to institutions'},{v:'abroad',t:'Wanting to study or migrate abroad'},
    {v:'flexible',t:'Keeping options open'},
  ]},
  {key:'support', title:'Who do you usually talk to about decisions like this?', hint:"This helps us know if a mentor chat would help.", options:[
    {v:'parents',t:'Parents or guardian'},{v:'teacher',t:'A teacher or counselor'},{v:'friends',t:'Friends'},
    {v:'mentor',t:'A mentor or someone in the field'},{v:'none',t:'No one right now'},
  ]},
];

function getStageQuestions(stage){
  switch(stage){
    case 'lower': return [
      {key:'lowerInterestSubjects', title:'Which subjects genuinely interest you?', hint:'Choose up to four — this is about curiosity, not grades yet.', multi:4, compact:true, options:[
        {v:'English',t:'English'},{v:'Mathematics',t:'Maths'},{v:'Science',t:'Science'},{v:'Social Studies',t:'Social Studies'},
        {v:'Art',t:'Art'},{v:'Technical/Craft',t:'Technical/Craft'},{v:'Agriculture',t:'Agriculture'},{v:'Music',t:'Music'},
      ]},
      {key:'pull', title:'What pulls you the most?', hint:'There is no wrong answer — this is just a starting hunch.', options:[
        {v:'engineering',t:'Building or fixing things'},{v:'technology',t:'Numbers, patterns, or computers'},
        {v:'law',t:'People, arguing your point, or persuading'},{v:'creative',t:'Reading, writing, or making things'},
      ]},
    ];
    case 'form4': return [
      {key:'term', title:'Which term are you in right now?', hint:'Helps us judge how much time is left this school year.', options:[
        {v:'term1',t:'Term 1',s:'Start of the school year'},{v:'term2',t:'Term 2',s:'Midway through'},{v:'term3',t:'Term 3',s:'Final term'},
      ]},
      {key:'afterCsecGuess', title:'What\u2019s your best guess for after CSEC?', hint:'This can change \u2014 we just need a starting point.', options:[
        {v:'sixthform',t:'Sixth Form / CAPE'},{v:'gti',t:'GTI / Technical'},{v:'work',t:'Work'},{v:'undecided',t:'Not sure yet'},
      ]},
    ];
    case 'form5': return [
      {key:'term', title:'Which term are you in right now?', hint:'Term 3 means exams are close \u2014 we\u2019ll flag things as more urgent.', options:[
        {v:'term1',t:'Term 1',s:'Start of the school year'},{v:'term2',t:'Term 2',s:'Midway through'},{v:'term3',t:'Term 3',s:'Exams approaching'},
      ]},
      {key:'registered', title:'Have you registered for CSEC yet?', options:[
        {v:'yes',t:'Yes, registered'},{v:'no',t:'Not yet'},{v:'not-sure',t:'Not sure'},
      ]},
      {key:'planA', title:'What\u2019s your Plan A after results?', hint:'Think about this before results land, not after.', options:[
        {v:'sixthform',t:'Sixth Form / CAPE'},{v:'gti',t:'GTI'},{v:'cpce',t:'CPCE (Teaching)'},{v:'nursing',t:'Nursing'},{v:'goal',t:'GOAL programme'},{v:'work',t:'Work'},
      ]},
    ];
    case 'postcsec': return [
      {key:'nextLean', title:'What are you leaning toward next?', options:[
        {v:'sixthform',t:'Sixth Form / CAPE'},{v:'gti',t:'GTI'},{v:'cpce',t:'CPCE (Teaching)'},{v:'nursing',t:'Nursing'},{v:'goal',t:'GOAL programme'},{v:'work',t:'Work'},{v:'undecided',t:'Still deciding'},
      ]},
    ];
    case 'sixthform': return [
      {key:'term', title:'Which term are you in right now?', options:[
        {v:'term1',t:'Term 1',s:'Start of the school year'},{v:'term2',t:'Term 2',s:'Midway through'},{v:'term3',t:'Term 3',s:'CAPE exams approaching'},
      ]},
      {key:'targetField', title:'What field are you targeting?', options:[
        {v:'science',t:'Science & Medicine'},{v:'engineering',t:'Engineering'},{v:'business',t:'Business'},
        {v:'law',t:'Law & Humanities'},{v:'creative',t:'Creative Industry'},{v:'agriculture',t:'Agriculture'},{v:'technology',t:'Technology'},{v:'other',t:'Other'},
      ]},
    ];
    case 'postcape': return [
      {key:'postCapeLean', title:'Where are you leaning?', options:[
        {v:'ug',t:'University of Guyana'},{v:'uwi',t:'UWI'},{v:'abroad',t:'Studying abroad'},{v:'goal',t:'GOAL programme'},{v:'work',t:'Work'},{v:'undecided',t:'Still deciding'},
      ]},
    ];
    default: return [];
  }
}

/* ============================================================
   PARENT / TEACHER LIGHT INTAKE
   ============================================================ */
function getParentFlow(role){
  return [
    {key:'childStage', title: role==='teacher' ? 'What stage are most of your students at?' : 'What stage is your child at?', options: STAGES.map(s=>({v:s.v,t:s.t,s:s.s}))},
    {key:'childInterests', title: role==='teacher' ? 'What are your students generally curious about?' : 'What does your child seem interested in?', hint:'Choose up to three \u2014 this is a general steer, not a locked-in plan.', multi:3, options:[
      {v:'science',t:'Science & Medicine'},{v:'engineering',t:'Engineering'},{v:'business',t:'Business & Entrepreneurship'},
      {v:'law',t:'Law & Humanities'},{v:'creative',t:'Creative Industry'},{v:'agriculture',t:'Agriculture'},
      {v:'technology',t:'Technology'},{v:'other',t:'Other'},
    ]},
    {key:'region', title:'Which region are you in?', compact:true, options:[
      {v:'r1',t:'Region 1'},{v:'r2',t:'Region 2'},{v:'r3',t:'Region 3'},{v:'r4',t:'Region 4'},{v:'r5',t:'Region 5'},
      {v:'r6',t:'Region 6'},{v:'r7',t:'Region 7'},{v:'r8',t:'Region 8'},{v:'r9',t:'Region 9'},{v:'r10',t:'Region 10'},
    ]},
  ];
}

/* ============================================================
   STATE
   ============================================================ */
let fullFlow = [];
let step = 0;
let answers = {};
let role = null;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const ROLE_QUESTION = {
  key:'role', title:'Who is this for?', hint:'This decides what we show you next.', options:[
    {v:'student', t:'I\u2019m a student', s:'Build my own plan.'},
    {v:'parent', t:'I\u2019m a parent / guardian', s:'See what could help my child.'},
    {v:'teacher', t:'I\u2019m a teacher / other', s:'See resources for my students.'},
  ]
};
const STAGE_QUESTION = {key:'stage', title:'Where are you in your school journey?', hint:'This decides which questions we ask next.', options: STAGES.map(s=>({v:s.v,t:s.t,s:s.s}))};

function totalLabel(){
  // total is unknown until we know the branch (role, then stage if student)
  if(fullFlow.length <= 1) return '?';
  if(role==='student' && !answers.stage) return '?';
  return fullFlow.length;
}

function renderQuestion(){
  const q = fullFlow[step];
  const stepNum = step+1;
  const total = totalLabel();
  $('#quizCount').textContent = `QUESTION ${stepNum}${total!=='?' ? ' OF '+total : ''}`;
  $('#quizProgress').style.width = total==='?' ? Math.min(90, stepNum*8)+'%' : Math.round(stepNum/total*100)+'%';
  const multi = q.multi || 1;
  const selected = answers[q.key] || [];
  const optsHtml = q.options.map(o=>{
    const isSel = selected.includes(o.v);
    return `<button class="choice ${isSel?'selected':''}" data-v="${o.v}"><strong>${o.t}</strong>${o.s?`<small>${o.s}</small>`:''}</button>`;
  }).join('');
  const layout = q.compact ? 'compact' : (q.key==='role' || q.key==='pull' ? 'single-col' : '');
  $('#quizQuestion').innerHTML = `<h2>${q.title}</h2><p class="quiz-hint">${q.hint||''}</p><div class="choices ${layout}">${optsHtml}</div>${multi>1?`<p class="multi-note">Select up to ${multi}.</p>`:''}`;
  $$('#quizQuestion .choice').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = btn.dataset.v;
      let arr = answers[q.key] || [];
      if(multi===1){ arr=[v]; } else {
        if(arr.includes(v)) arr = arr.filter(x=>x!==v);
        else { if(arr.length>=multi){ return; } arr=[...arr,v]; }
      }
      answers[q.key] = arr;
      renderQuestion();
    });
  });
  $('#quizBack').style.visibility = step===0 ? 'hidden':'visible';
  $('#quizNext').disabled = !(answers[q.key] && answers[q.key].length);
  const knownTotal = total!=='?';
  const isLast = knownTotal && stepNum===total;
  $('#quizNext').textContent = isLast ? (role==='student' ? 'Build my plan \u2192' : 'See what helps \u2192') : 'Continue \u2192';
}

function start(){
  fullFlow = [ROLE_QUESTION];
  step = 0;
  renderQuestion();
}

$('#quizNext').addEventListener('click', ()=>{
  const q = fullFlow[step];
  // extend the flow the moment we learn enough to know what's next
  if(q.key==='role'){
    role = answers.role[0];
    fullFlow = role==='student' ? [ROLE_QUESTION, STAGE_QUESTION] : [ROLE_QUESTION, ...getParentFlow(role)];
  } else if(q.key==='stage'){
    fullFlow = [ROLE_QUESTION, STAGE_QUESTION, ...getStageQuestions(answers.stage[0]), ...UNIVERSAL_QUESTIONS];
  }
  if(step < fullFlow.length-1){
    step++;
    renderQuestion();
  } else {
    finish();
  }
});

$('#quizBack').addEventListener('click', ()=>{
  if(step===0) return;
  step--;
  renderQuestion();
});

function finish(){
  $('#quizArea').classList.add('hidden');
  $('#loadingView').classList.remove('hidden');
  if(role==='student'){
    $('#loadingText').textContent = 'Building your plan\u2026';
    setTimeout(()=>{
      const plan = generatePlan(answers);
      localStorage.setItem('nsg_myplan', JSON.stringify(plan));
      location.href = 'my-plan.html';
    }, 1100);
  } else {
    $('#loadingText').textContent = 'Finding what can help\u2026';
    setTimeout(()=>{
      localStorage.setItem('nsg_parent_view', JSON.stringify({role, childStage: answers.childStage[0], childInterests: answers.childInterests||[], region: answers.region?answers.region[0]:null}));
      location.href = 'parent-landing.html';
    }, 1100);
  }
}

/* ============================================================
   GAP-ANALYSIS PLAN GENERATION (same logic as my-plan.html)
   ============================================================ */
function pickStarKey(a){
  if(a.targetField && a.targetField[0]) return a.targetField[0];
  const interests = a.interests || [];
  const found = interests.find(i=>REQUIREMENTS[i]);
  if(found) return found;
  if(a.pull && a.pull[0]) return a.pull[0];
  return 'other';
}
function subjectLevelForStage(stage){
  if(stage==='sixthform') return 'CAPE';
  if(stage==='postcape') return null;
  return 'CSEC';
}
function computeSubjectGaps(starKey, studentSubjects, level){
  const req = REQUIREMENTS[starKey];
  if(!req) return [];
  const list = level==='CAPE' ? (req.recommendedCAPE||[]) : (req.mustHaveCSEC||[]);
  const have = (studentSubjects||[]).map(s=>s.name);
  return list.filter(s=>!have.includes(s));
}
function generatePlan(a){
  const starKey = pickStarKey(a);
  const req = REQUIREMENTS[starKey];
  const stage = a.stage[0];
  const level = subjectLevelForStage(stage);
  const term = a.term ? a.term[0] : null;

  // Subjects are no longer collected in the quiz \u2014 they're added (with grades) in My Plan,
  // and the gap-check runs the moment they are. Starting empty means the Star card should say
  // "add your subjects to see your real gaps," not imply a clean bill of health.
  const subjects = [];
  const milestones = [];

  milestones.push({id:'m-subjects', type:'profile', title:'Add your subjects & grades', desc:'This is what your plan actually checks against \u2014 nothing else can be verified until this is filled in.', xp:20, done:false});
  milestones.push({id:'m-achieve', type:'profile', title:'Log your first achievement', desc:'Clubs, awards, volunteer work \u2014 it all counts, and sharpens your mentor match too.', xp:15, done:false});

  const decision = a.priority || [];
  if(decision.includes('affordable')) milestones.push({id:'m-fund', type:'task', title:'Start your scholarship / GOAL readiness checklist', desc:'University tuition is now free at UG \u2014 but transport, materials and applications still cost something.', xp:20, done:false});
  if(decision.includes('family')) milestones.push({id:'m-family', type:'navi', title:'Ask Navi: talking to your family about this', desc:'Get a mentor\u2019s take on navigating expectations.', xp:15, done:false, context:'family'});
  if(decision.includes('work-soon')) milestones.push({id:'m-work', type:'task', title:'Explore work + study routes', desc:'Income and experience while studying part-time.', xp:15, done:false});
  if(decision.includes('distance')) milestones.push({id:'m-dist', type:'task', title:'Find sessions near your region', desc:'Check what\u2019s realistic where you are.', xp:10, done:false});
  if(decision.includes('abroad')) milestones.push({id:'m-abroad', type:'task', title:'Research scholarships abroad', desc:'Start a shortlist of programmes.', xp:15, done:false});
  if((a.support && a.support[0]==='none') && !decision.includes('family')) milestones.push({id:'m-support', type:'navi', title:'Ask Navi who could support you', desc:'You don\u2019t have to figure this out alone.', xp:10, done:false, context:'support'});

  if(stage==='form5' && a.registered && a.registered[0]==='no')
    milestones.push({id:'m-register', type:'task', title:'Submit your CSEC registration', desc:'Registration windows are short \u2014 don\u2019t miss it.', xp:20, done:false, urgent: term==='term3' || term==='term2'});

  if(term==='term3' && (stage==='form5' || stage==='sixthform'))
    milestones.push({id:'m-examprep', type:'task', title:'Start focused exam revision', desc:'Final term \u2014 this is the moment to lock in a revision schedule, not wait for it to feel urgent.', xp:20, done:false, urgent:true});

  milestones.push({id:'m-session', type:'session', title:'Attend a pod session', desc:'Group clinic on your Star or CSEC/CAPE.', xp:20, done:false});
  milestones.push({id:'m-mentor', type:'mentor', title:'Pick a mentor to inspire you', desc:'See how someone similar got there.', xp:10, done:false});

  return {

}
