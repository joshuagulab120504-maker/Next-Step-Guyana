<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1930">
<title>For Parents & Teachers — Next Step Guyana</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@500;600;700;800&display=swap');
:root{
  --navy:#0a1930;--navy2:#123a52;--teal:#0e7a4f;--teal2:#149b62;--gold:#eeb52f;
  --ink:#101a28;--muted:#5c6c7e;--paper:#f5f7fa;--line:#dfe6ec;--soft:#eaf3ee;
  --glass-bg:rgba(255,255,255,.7);--glass-line:rgba(255,255,255,.5);--glass-navy:rgba(8,22,40,.74);
  --radius-lg:20px;--font-display:'Fraunces',ui-serif,Georgia,serif;--font-accent:'Sora',ui-sans-serif,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --purple:#6a55b0;--purple-soft:#f0ebff;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--font-body)}
button{font:inherit;cursor:pointer}
.wrap{width:min(900px,calc(100% - 28px));margin:auto}
h1,h2{font-family:var(--font-display);font-weight:650;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 16px;min-height:42px;background:linear-gradient(135deg,var(--teal2),var(--teal));color:#fff;font-family:var(--font-accent);font-weight:700;font-size:12.5px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 13px;font-size:11px;min-height:36px}
.card{background:var(--glass-bg);backdrop-filter:blur(16px);border:1px solid var(--glass-line);border-radius:var(--radius-lg);padding:17px}
.tag{display:inline-flex;padding:4px 9px;border-radius:99px;background:var(--soft);color:#0e6b45;font-size:9.5px;font-weight:800}
.tag.mentor{background:var(--purple-soft);color:var(--purple)}

.topbar{background:var(--glass-navy);backdrop-filter:blur(16px);color:#fff;padding:12px 0}
.topbar-row{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-family:var(--font-accent);font-weight:800;font-size:14px}
.brand .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,var(--teal2),var(--teal));display:grid;place-items:center;font-size:14px}
.navlinks{display:flex;gap:16px;margin-left:auto}
.navlinks a{color:#cfdaea;text-decoration:none;font-size:12.5px;font-weight:700}
.navlinks a:hover{color:#fff}
.role-badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:5px 11px;font-size:10px;font-weight:800;color:#8fd6ae}
@media(max-width:700px){.navlinks{display:none}}

.hero{padding:36px 0 8px}
.hero .eyebrow{display:inline-flex;background:var(--soft);color:#0e6b45;border-radius:99px;padding:6px 12px;font-size:10px;font-weight:800;letter-spacing:.05em;font-family:var(--font-accent)}
.hero h1{font-size:clamp(26px,4vw,36px);margin:12px 0 8px}
.hero p{color:var(--muted);max-width:560px;font-size:14px}
.interest-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.interest-chips span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:11px;font-weight:700}

.section-label{font-family:var(--font-accent);font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--teal2);margin:30px 0 10px;text-transform:uppercase}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:760px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid3,.grid2{grid-template-columns:1fr}}

.feed-item{display:grid;grid-template-columns:40px 1fr;gap:11px}
.feed-item .ic{width:40px;height:40px;border-radius:11px;background:var(--soft);color:#0e6b45;display:grid;place-items:center;font-size:15px}
.feed-item h3{font-size:13.5px;margin:0 0 4px}
.feed-item p{font-size:11.5px;color:var(--muted);margin:0}

.mentor-card{text-align:center}
.mentor-card .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,var(--teal2),var(--teal));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;margin:0 auto 8px}
.mentor-card strong{display:block;font-size:12.5px}
.mentor-card small{display:block;color:var(--muted);font-size:10.5px;margin:2px 0 10px}

.session-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center}
.session-row .dbox{background:var(--navy);color:#fff;border-radius:10px;text-align:center;padding:7px 3px}
.session-row .dbox b{display:block;font-size:15px}.session-row .dbox small{font-size:7px;font-weight:800}
.session-row strong{display:block;font-size:12.5px}
.session-row p{margin:0;font-size:11px;color:var(--muted)}

.explore-band{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:24px;margin:32px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.explore-band h2{color:#fff;font-size:20px;margin:0 0 6px}
.explore-band p{color:#c9d8e2;margin:0;font-size:12.5px;max-width:420px}
.note{font-size:10.5px;color:var(--muted);text-align:center;padding:20px 0 60px}
.empty{text-align:center;padding:60px 20px}
</style>
</head>
<body>
<header class="topbar"><div class="wrap topbar-row">
  <a class="brand" href="index.html"><span class="mark">↗</span> NEXT STEP</a>
  <span class="role-badge" id="roleBadge">PARENT VIEW</span>
  <nav class="navlinks"><a href="feed.html">Feed</a><a href="mentors.html">Mentors</a><a href="sessions.html">Sessions</a><a href="about.html">About Us</a></nav>
</div></header>

<main class="wrap">
  <div id="content"></div>
  <div class="empty" id="emptyState" style="display:none">
    <p style="color:var(--muted)">We don't have your details yet.</p>
    <button class="btn" onclick="location.href='check.html'">Start the 60-second check-in →</button>
  </div>
</main>

<script>
const MENTORS = [
  {id:'aniyah', name:'Aniyah Couchman', tag:'Stanford · Presidential Scholar', interests:['science','law','business']},
  {id:'joshua', name:'Joshua Gulab', tag:'Stanford · Valedictorian', interests:['business','technology','law']},
  {id:'alisande', name:'Alisande Jaiserrisingh', tag:'Northwestern · Valedictorian', interests:['creative','other','business']},
  {id:'dave', name:'Dave Chowtie', tag:'Presidential Scholar · STEM founder', interests:['science','technology','engineering']},
  {id:'reginald', name:'Reginald Brown', tag:"St. Stanislaus · Youth Parliament", interests:['law','other']},
  {id:'riley', name:'Riley Nurse', tag:"U. Toronto · Int'l Scholar", interests:['business']},
];
const INTEREST_LABELS = {science:'Science & Medicine', engineering:'Engineering', business:'Business & Entrepreneurship', law:'Law & Humanities', creative:'Creative Industry', agriculture:'Agriculture', technology:'Technology', other:'Other'};
const STAGE_LABELS = {lower:'Forms 1–3', form4:'Form 4', form5:'Form 5 / CSEC', postcsec:'Just finished CSEC', sixthform:'Sixth Form / CAPE', postcape:'Just finished CAPE'};

const FEED_BY_INTEREST = {
  science:[{ic:'\u25c9',title:'Choosing between Biology and Chemistry-heavy routes',desc:'A mentor breaks down what each actually leads to.'}],
  law:[{ic:'\u2696',title:'Why Caribbean History matters for Law at CAPE',desc:'A subject-planning note worth sharing with your child.'}],
  business:[{ic:'\ud83d\udcc8',title:'GOAL\u2019s Bachelor\u2019s window opens soon',desc:'Business & Entrepreneurship applicants should start early.'}],
  technology:[{ic:'\ud83d\udcbb',title:'Computer Science at CAPE: what it actually covers',desc:'Helpful before committing at Sixth Form.'}],
  engineering:[{ic:'\u2699',title:'Physics + Pure Maths: the common Engineering pairing',desc:'Worth confirming against the target programme.'}],
  agriculture:[{ic:'\ud83c\udf31',title:'Agricultural Science routes beyond farming',desc:'Environmental science and agri-business paths mentors have taken.'}],
  creative:[{ic:'\u270e',title:'Building a portfolio alongside CSEC',desc:'How one mentor balanced creative work with exams.'}],
  other:[{ic:'\u25cf',title:'It\u2019s okay to stay undecided a while longer',desc:'A flexible-track story from a mentor who took time to choose.'}],
};

function $(s){ return document.querySelector(s); }

function render(){
  const raw = localStorage.getItem('nsg_parent_view');
  if(!raw){ document.getElementById('emptyState').style.display='block'; return; }
  const data = JSON.parse(raw);
  const isTeacher = data.role === 'teacher';
  $('#roleBadge').textContent = isTeacher ? 'TEACHER VIEW' : 'PARENT VIEW';
  const interests = data.childInterests && data.childInterests.length ? data.childInterests : ['other'];
  const interestLabels = interests.map(i=>INTEREST_LABELS[i]||i);

  const matchedMentors = MENTORS.filter(m=>interests.some(i=>m.interests.includes(i))).slice(0,3);
  const mentorPool = matchedMentors.length ? matchedMentors : MENTORS.slice(0,3);

  const feedItems = interests.flatMap(i=>FEED_BY_INTEREST[i]||[]).slice(0,3);

  $('#content').innerHTML = `
    <section class="hero">
      <span class="eyebrow">${isTeacher ? 'BUILT FOR EDUCATORS' : 'BUILT FOR FAMILIES'}</span>
      <h1>${isTeacher ? 'What your students might be exploring.' : 'What could help your child right now.'}</h1>
      <p>Based on ${isTeacher ? 'the stage and interests you told us about your students' : 'your child\u2019s stage and interests'} \u2014 not connected to their personal plan, so nothing here is pulled from any account they may have.</p>
      <div class="interest-chips"><span>${STAGE_LABELS[data.childStage]||data.childStage}</span>${interestLabels.map(l=>`<span>${l}</span>`).join('')}</div>
    </section>

    <div class="section-label">From the Feed</div>
    <div class="grid3">${feedItems.map(f=>`<div class="card feed-item"><span class="ic">${f.ic}</span><div><h3>${f.title}</h3><p>${f.desc}</p></div></div>`).join('') || `<p style="color:var(--muted);font-size:12px">Nothing specific yet \u2014 browse the full Feed for more.</p>`}</div>

    <div class="section-label">Mentors who match this interest</div>
    <div class="grid3">${mentorPool.map(m=>`
      <div class="card mentor-card"><div class="av">${m.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
        <strong>${m.name}</strong><small>${m.tag}</small>
        <button class="btn ghost small" onclick="location.href='mentors.html'">View journey</button></div>`).join('')}</div>

    <div class="section-label">Sessions worth knowing about</div>
    <div class="grid2">
      <div class="card session-row"><div class="dbox"><b>Wed</b><small>6:30 PM</small></div><div><strong>Choosing CAPE Subjects</strong><p>Group Q&amp;A \u2014 open to all stages</p></div><button class="btn small" onclick="location.href='sessions.html'">Details</button></div>
      <div class="card session-row"><div class="dbox"><b>Daily</b><small>6:30 PM</small></div><div><strong>Life After CSEC Clinic</strong><p>Compares CAPE, TVET, university and work</p></div><button class="btn small" onclick="location.href='sessions.html'">Details</button></div>
    </div>

    <div class="explore-band">
      <div><h2>Want the full picture?</h2><p>Feed, Mentors and Sessions are open to everyone \u2014 browse without any filter.</p></div>
      <div style="display:flex;gap:8px"><button class="btn" onclick="location.href='feed.html'">Open Feed</button><button class="btn ghost" onclick="location.href='mentors.html'">Open Mentors</button></div>
    </div>
    <p class="note">This view is self-reported and intentionally kept separate from any student's own account and plan \u2014 nothing here reflects real progress data.</p>
  `;
}
render();
</script>
</body>
</html>
