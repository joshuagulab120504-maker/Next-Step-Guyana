<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05162a">
<title>Questions · Next Step Guyana</title>
<link rel="stylesheet" href="assets/nsg-theme.css">
</head>
<body>
<main class="app-main" id="app"></main>
<script src="nsg-data.js"></script>
<script src="nsg-app.js"></script>
<script>
(function(){
  NSG_APP.mountShell('questions');
  var params = new URLSearchParams(location.search);
  var q = params.get('q') || '';
  if (params.get('q') === 'fork') q = 'fork CAPE leave';
  NSG_APP.renderQuestions(document.getElementById('app'), {
    query: q,
    focusId: params.get('id') || null
  });
  var id = params.get('id');
  if (id) NSG_APP.markOpened(id);
})();
</script>
</body>
</html>
